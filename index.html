<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Stardust Poker Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 fill=%22%2305070d%22/><path d=%22M11.55,16.66 L13.78,17.21 L11.28,22.50 Z%22 fill=%22%23ffb454%22/><path d=%22M16.36,2.10 L12.22,8.00 L17.26,9.26 Z M12.59,6.52 L17.63,7.77 L15.19,17.57 L10.14,16.31 Z M10.98,12.97 L10.03,16.75 L6.36,18.20 Z M16.02,14.23 L15.08,18.01 L17.64,21.01 Z%22 fill=%22%234deeea%22/><circle cx=%2214.63%22 cy=%229.07%22 r=%221.03%22 fill=%22%230a101c%22/></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="theme-color" content="#05070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stardust">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05070d;
    --void-2:#070b14;
    --panel:#0b1220;
    --panel-2:#0f1830;
    --line:#223258;
    --line-soft:#182541;
    --cyan:#4deeea;
    --cyan-dim:#2a8f8c;
    --violet:#a685ff;
    --amber:#ffb454;
    --thrust:#39ff8a;
    --danger:#ff4d6d;
    --ink:#e9f2ff;
    --ink-dim:#7f92b8;
    --shadow:0 10px 30px rgba(0,0,0,.55);
    --glow-cyan:0 0 16px rgba(77,238,234,.35);
    --font-display:'Orbitron','Segoe UI',system-ui,sans-serif;
    --font-body:'Rajdhani','Segoe UI',system-ui,sans-serif;
    --font-mono:'Share Tech Mono','SFMono-Regular',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    min-height:100vh;
    padding-bottom:96px;
    position:relative;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
    .modal-icon.danger .collision-scene{ display:none; }
    .modal-icon.danger #modalIconSingle{ display:block; }
  }

  #starfield{ position:fixed; inset:0; z-index:-1; display:block; background:var(--void); }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(5,7,13,.96), rgba(5,7,13,.86));
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-soft);
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  header.top .brand{display:flex; align-items:center; gap:10px;}
  header.top .mark{width:26px; height:26px; color:var(--cyan); filter:drop-shadow(0 0 6px rgba(77,238,234,.6));}
  header.top h1{
    margin:0; font-family:var(--font-display); font-weight:800; font-size:19px;
    letter-spacing:1.5px; color:var(--ink);
    animation:powerOn .9s ease-out both;
  }
  header.top h1 .accent{color:var(--cyan);}
  header.top .sub{
    font-family:var(--font-mono); color:var(--ink-dim); font-size:10.5px;
    letter-spacing:1.2px; margin-top:2px; text-transform:uppercase;
  }
  @keyframes powerOn{
    0%{ opacity:0; letter-spacing:4px; text-shadow:0 0 0 transparent; }
    60%{ opacity:1; text-shadow:0 0 18px rgba(77,238,234,.7); }
    100%{ opacity:1; letter-spacing:1.5px; text-shadow:0 0 0 transparent; }
  }
  .status-light{
    width:10px; height:10px; border-radius:50%; background:var(--line);
    flex-shrink:0; transition:background .3s ease;
  }
  .status-light.live{
    background:var(--thrust);
    box-shadow:0 0 10px 3px rgba(57,255,138,.65);
    animation:pulse 1.7s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  main{max-width:640px; margin:0 auto; padding:18px 16px;}
  @media (min-width:760px){ main{max-width:880px;} }
  @media (min-width:1100px){ main{max-width:1140px;} }

  /* ---------- Panels ---------- */
  .card{
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 40%), var(--panel);
    border:1px solid var(--line);
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
    padding:18px;
    margin-bottom:16px;
  }
  .card .bracket{ position:absolute; width:14px; height:14px; pointer-events:none; opacity:.9; }
  .card .bracket.tr{ top:-1px; right:-1px; border-top:2px solid var(--cyan); border-right:2px solid var(--cyan); }
  .card .bracket.bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--cyan); border-left:2px solid var(--cyan); }

  .eyebrow{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:2.5px;
    color:var(--cyan-dim); text-transform:uppercase; margin:0 0 4px;
  }
  .card h2{
    margin:0 0 14px; font-family:var(--font-display); font-weight:700; font-size:14px;
    color:var(--ink); text-transform:uppercase; letter-spacing:1px;
  }

  input[type=text], input[type=number]{
    background:var(--void-2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--font-body);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    padding:10px 12px;
    font-size:15px;
    width:100%;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=number]{ font-family:var(--font-mono); }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  input[type=text]:focus, input[type=number]:focus{ border-color:var(--cyan); box-shadow:0 0 0 2px rgba(77,238,234,.15); }
  input:focus-visible{ outline:2px solid var(--cyan); outline-offset:1px; }

  /* ---------- Custom day/month/year date fields (no native calendar) ---------- */
  .date-fields{display:inline-flex; align-items:center; gap:3px; vertical-align:middle;}
  .date-fields input, .date-fields select{
    font-family:var(--font-mono); text-align:center;
    background:transparent; border:none; color:var(--ink-dim);
    padding:2px 1px; outline:none; cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  .date-fields input:focus, .date-fields select:focus{ color:var(--cyan); }
  .date-fields .date-sep{color:var(--ink-dim); font-family:var(--font-mono); font-size:.9em;}
  .date-fields.boxed{
    background:var(--void-2); border:1px solid var(--line);
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    padding:9px 10px; font-size:13px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .date-fields.boxed input, .date-fields.boxed select{ color:var(--ink); font-size:13px; }
  .date-fields.boxed .date-day{width:20px;}
  .date-fields.boxed .date-year{width:38px;}
  .date-fields.boxed:focus-within{ border-color:var(--cyan); box-shadow:0 0 0 2px rgba(77,238,234,.15); }
  .date-set-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .date-set-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1.5px; color:var(--ink-dim);}

  button{
    font-family:var(--font-body);
    cursor:pointer;
    border:none;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
    padding:10px 16px;
    font-size:14px;
    font-weight:700;
    letter-spacing:.6px;
    text-transform:uppercase;
    display:inline-flex; align-items:center; gap:6px;
    transition:transform .06s ease, filter .15s ease, box-shadow .15s ease;
  }
  button:active{transform:scale(.96);}
  button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  button .icon{width:15px; height:15px; flex-shrink:0;}

  .btn-primary{background:linear-gradient(135deg, var(--cyan), var(--cyan-dim)); color:#04211f;}
  .btn-primary:hover{ box-shadow:var(--glow-cyan); filter:brightness(1.06); }
  .btn-ghost{background:var(--void-2); color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--cyan); color:var(--cyan);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(255,77,109,.5);}
  .btn-danger:hover{background:rgba(255,77,109,.1); box-shadow:0 0 12px rgba(255,77,109,.25);}
  .btn-sm{padding:7px 10px; font-size:11.5px;}
  .btn-chip{background:var(--void-2); color:var(--amber); border:1px solid rgba(255,180,84,.35); font-family:var(--font-mono); text-transform:none; letter-spacing:0;}
  .btn-chip:hover{border-color:var(--amber); box-shadow:0 0 10px rgba(255,180,84,.25);}
  button:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

  .row{display:flex; gap:8px;}
  .row.wrap{flex-wrap:wrap;}
  .row.between{justify-content:space-between; align-items:center;}
  .grow{flex:1;}

  /* ---------- Player readout ---------- */
  .player-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(258px, 1fr));
    gap:10px;
    margin-bottom:4px;
    align-items:start;
  }
  .player{
    position:relative;
    border:1px solid var(--line-soft);
    border-left-width:3px;
    border-left-color:rgba(255,180,84,.55);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    padding:13px;
    background:linear-gradient(180deg, rgba(77,238,234,.03), transparent 60%), var(--void-2);
    transition:border-color .2s ease;
  }
  .player.done{ opacity:.72; border-left-color:rgba(57,255,138,.5); }
  .player .name-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px;}
  .player .name{font-family:var(--font-display); font-size:15px; font-weight:700; letter-spacing:.3px;}
  .player .status{
    font-family:var(--font-mono); font-size:10.5px; padding:3px 9px 3px 8px;
    display:inline-flex; align-items:center; letter-spacing:.8px; text-transform:uppercase;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    white-space:nowrap;
  }
  .status::before{ content:''; width:6px; height:6px; border-radius:50%; margin-right:6px; display:inline-block; }
  .status.playing{background:rgba(255,180,84,.1); color:var(--amber); border:1px solid rgba(255,180,84,.4);}
  .status.playing::before{background:var(--amber); animation:pulse 1.4s ease-in-out infinite;}
  .status.cashed{background:rgba(57,255,138,.1); color:var(--thrust); border:1px solid rgba(57,255,138,.4);}
  .status.cashed::before{background:var(--thrust);}

  .stat-line{display:flex; gap:16px; font-size:13px; color:var(--ink-dim); margin-bottom:10px; flex-wrap:wrap;}
  .stat-line b{color:var(--ink); font-family:var(--font-mono); font-weight:400; font-variant-numeric:tabular-nums;}
  .net{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .net.pos{color:var(--thrust); font-weight:700; text-shadow:0 0 10px rgba(57,255,138,.35);}
  .net.neg{color:var(--danger); font-weight:700; text-shadow:0 0 10px rgba(255,77,109,.35);}

  .buyin-control{display:flex; gap:6px; margin-bottom:8px; align-items:center;}
  .buyin-trigger .buyin-count{opacity:.75; margin-left:2px;}
  .cashout-row{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}

  /* ---------- Buy-in popover menu ---------- */
  .buyin-menu{
    position:fixed; z-index:60; display:none;
    width:236px; max-width:calc(100vw - 20px);
    background:var(--panel-2); border:1px solid var(--line);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    box-shadow:var(--shadow), 0 0 24px rgba(77,238,234,.15);
    padding:14px;
  }
  .buyin-menu.open{display:block;}
  .buyin-menu-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-dim); margin:0 0 6px;}
  .buyin-menu-label.spaced{margin-top:12px;}
  .buyin-menu-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .buyin-menu-grid button{width:100%; justify-content:center;}
  .buyin-menu-custom{display:flex; gap:6px;}
  .buyin-menu-custom input{flex:1; min-width:0;}
  .buyin-menu-footer{margin-top:12px; padding-top:10px; border-top:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .buyin-menu-footer .hint{margin:0; text-align:left;}
  .buyin-menu-close{
    position:absolute; top:8px; right:9px; background:none; border:none; clip-path:none;
    color:var(--ink-dim); cursor:pointer; padding:2px; font-size:16px; line-height:1; font-family:var(--font-body);
  }
  .buyin-menu-close:hover{color:var(--cyan);}

  .btn-cashout{background:linear-gradient(135deg, var(--amber), #b97a2e); color:#2b1600;}
  .btn-cashout:hover{ box-shadow:0 0 16px rgba(255,180,84,.45); filter:brightness(1.06); }

  /* ---------- Cash-out popover menu (chip counter) ---------- */
  .cashout-menu{width:272px;}
  .chip-badge{
    width:22px; height:22px; border-radius:50%; flex-shrink:0;
    background:repeating-conic-gradient(currentColor 0deg 26deg, transparent 26deg 60deg);
    border:2px solid currentColor;
    position:relative;
  }
  .chip-badge::after{
    content:''; position:absolute; inset:5px; border-radius:50%;
    background:var(--panel-2); border:1px solid currentColor;
  }
  .chip-10c{color:var(--ink-dim);}
  .chip-25c{color:var(--thrust);}
  .chip-50c{color:var(--cyan);}
  .chip-1{color:var(--violet);}
  .chip-5{color:var(--amber);}
  .cashout-menu-row{display:grid; grid-template-columns:22px 36px 1fr auto; align-items:center; gap:8px; margin-bottom:8px;}
  .cashout-menu-row label{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-dim); cursor:pointer;}
  .cashout-menu-row input{padding:6px 4px; font-size:13px; text-align:center;}
  .cashout-menu-row .subtotal{
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim);
    min-width:50px; text-align:right; font-variant-numeric:tabular-nums;
  }
  .cashout-menu-total{
    margin-top:6px; padding-top:12px; border-top:1px solid var(--line-soft);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .cashout-menu-total .label{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--ink-dim);}
  .cashout-menu-total .value{
    font-family:var(--font-display); font-weight:800; font-size:22px; color:var(--amber);
    text-shadow:0 0 12px rgba(255,180,84,.5); font-variant-numeric:tabular-nums;
  }

  .cashout-mode-toggle{
    display:flex; gap:4px; margin-bottom:14px; padding:3px;
    background:var(--void-2); border:1px solid var(--line-soft);
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .cashout-mode-toggle .mode-btn{
    flex:1; background:none; border:none; clip-path:none;
    padding:7px 6px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
    color:var(--ink-dim); cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .cashout-mode-toggle .mode-btn.active{
    background:linear-gradient(135deg, var(--amber), #b97a2e); color:#2b1600;
  }
  .cashout-mode-panel[hidden]{display:none;}
  #cashoutManualAmount{font-size:20px; text-align:center; padding:12px;}

  /* ---------- Balance / status banners ---------- */
  .balance-banner{
    position:relative;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    padding:12px 14px; margin-bottom:14px;
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:.3px; font-weight:400;
    display:flex; align-items:center; gap:10px; text-transform:uppercase;
  }
  .balance-banner .icon{width:18px; height:18px; flex-shrink:0;}
  .balance-banner.ok{background:rgba(57,255,138,.08); border:1px solid rgba(57,255,138,.4); color:var(--thrust);}
  .balance-banner.bad{background:rgba(255,77,109,.08); border:1px solid rgba(255,77,109,.4); color:var(--danger);}
  .balance-banner.info{background:rgba(77,238,234,.06); border:1px solid rgba(77,238,234,.3); color:var(--cyan);}

  .anomaly-note{
    margin:-8px 0 14px; padding:12px 14px;
    background:rgba(255,77,109,.05); border:1px solid rgba(255,77,109,.3);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }
  .anomaly-note-label{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--danger); opacity:.85; margin-bottom:8px;
  }
  .anomaly-note textarea{
    width:100%; resize:vertical; min-height:44px;
    background:var(--void-2); border:1px solid var(--line); color:var(--ink);
    font-family:var(--font-body); font-size:13.5px; padding:9px 11px; outline:none;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .anomaly-note textarea:focus{border-color:var(--danger); box-shadow:0 0 0 2px rgba(255,77,109,.15);}

  .anomaly-note-ro{
    margin-top:10px; padding:10px 12px;
    background:rgba(255,77,109,.05); border:1px solid rgba(255,77,109,.25);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .anomaly-note-ro p{margin:0; font-size:13px; color:var(--ink-dim); line-height:1.4;}

  /* ---------- History edit mode ---------- */
  .session-summary td input[type=number]{padding:6px 8px; font-size:13px; width:100%; min-width:64px;}
  .session-summary .edit-title{flex:1; min-width:0; width:auto; margin-bottom:2px;}
  .session-summary td.edit-remove{padding:9px 4px; text-align:right;}
  .session-summary td.edit-remove button{padding:5px 7px;}

  /* ---------- History date filter & collapse ---------- */
  .history-filter{padding:14px 18px;}
  .history-filter .date-range-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .date-range-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-dim);}
  .history-toolbar{display:flex; justify-content:flex-end; margin-bottom:10px;}
  .session-toggle{cursor:pointer; user-select:none;}
  .session-toggle:hover .title{color:var(--cyan);}
  .collapse-chevron{width:12px; height:12px; margin-right:2px; vertical-align:-1px; transition:transform .15s ease; color:var(--ink-dim); flex-shrink:0;}
  .collapse-chevron.collapsed{transform:rotate(-90deg);}
  .session-summary.is-collapsed{padding:14px 18px;}

  /* ---------- Crew roster management ---------- */
  .roster-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:8px;
  }
  .roster-row{
    display:flex; gap:2px; align-items:center;
    padding:7px 6px 7px 12px;
    background:var(--void-2); border:1px solid var(--line-soft);
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .roster-row .roster-name-text{
    flex:1; min-width:0; font-family:var(--font-body); font-size:14.5px; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .roster-row.editing{padding-left:8px;}
  .roster-row input{flex:1; min-width:0;}

  /* ---------- Player name suggestion dropdown ---------- */
  .suggest-box{width:280px; max-height:308px; overflow-y:auto; padding:8px;}
  .suggest-row{
    display:flex; align-items:center; gap:4px;
    padding:9px 8px; cursor:pointer;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    transition:background .12s ease;
  }
  .suggest-row:hover{background:var(--void-2);}
  .suggest-row.editing{padding:6px 8px; cursor:default;}
  .suggest-name{
    flex:1; font-family:var(--font-body); font-size:14.5px; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .suggest-icon-btn{
    background:none; border:none; clip-path:none; padding:5px; color:var(--ink-dim);
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .suggest-icon-btn .icon{width:14px; height:14px;}
  .suggest-icon-btn:hover{color:var(--cyan);}
  .suggest-icon-btn.danger:hover{color:var(--danger);}
  .suggest-edit-input{flex:1; padding:6px 8px; font-size:13.5px;}
  .suggest-empty{padding:14px 8px; color:var(--ink-dim); font-family:var(--font-mono); font-size:12px; text-align:center;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{text-align:left; padding:9px 6px; border-bottom:1px solid var(--line-soft);}
  td{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  td:first-child{font-family:var(--font-body); font-weight:600;}
  th{color:var(--ink-dim); font-family:var(--font-mono); font-weight:400; font-size:10.5px; text-transform:uppercase; letter-spacing:1px;}
  tr:last-child td{border-bottom:none;}

  .rank-badge{
    width:30px; height:30px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:13px; color:var(--void);
    background:var(--ink-dim);
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  }
  .rank-badge.r1{background:var(--cyan); box-shadow:0 0 12px rgba(77,238,234,.55);}
  .rank-badge.r2{background:var(--violet); box-shadow:0 0 10px rgba(166,133,255,.4);}
  .rank-badge.r3{background:var(--amber); box-shadow:0 0 10px rgba(255,180,84,.35);}

  .mini-lb-row-wrap{border-bottom:1px solid var(--line-soft);}
  .mini-lb-row-wrap:last-child{border-bottom:none;}
  .mini-lb-row-wrap .lb-chips, .mini-lb-row-wrap .lb-range{padding-left:26px;}
  .mini-lb-row-wrap .lb-chips{margin-bottom:8px;}
  .mini-lb-row-wrap .lb-range{margin-bottom:12px;}
  .mini-lb-row{display:flex; align-items:center; gap:8px; padding:8px 0; cursor:pointer; user-select:none;}
  .mini-lb-row:hover .mini-lb-name{color:var(--cyan);}
  .mini-lb-name{flex:1; font-family:var(--font-display); font-weight:700; font-size:13.5px;}

  /* ---------- Leaderboard cards ---------- */
  .leaderboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:12px;
  }
  .leaderboard-card{padding:16px; margin:0; display:flex; flex-direction:column; gap:12px;}
  .lb-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .lb-who{display:flex; align-items:center; gap:10px; min-width:0;}
  .lb-name{
    font-family:var(--font-display); font-weight:700; font-size:15px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .lb-net-pill{
    flex-shrink:0; font-family:var(--font-mono); font-weight:700; font-size:15px;
    padding:6px 12px; font-variant-numeric:tabular-nums;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .lb-net-pill.pos{background:rgba(57,255,138,.1); color:var(--thrust); border:1px solid rgba(57,255,138,.4); text-shadow:0 0 10px rgba(57,255,138,.3);}
  .lb-net-pill.neg{background:rgba(255,77,109,.1); color:var(--danger); border:1px solid rgba(255,77,109,.4); text-shadow:0 0 10px rgba(255,77,109,.3);}

  .lb-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .lb-chip{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--void-2); border:1px solid var(--line-soft);
    color:var(--ink-dim); font-family:var(--font-mono); font-size:11px;
    padding:5px 10px 5px 9px; white-space:nowrap;
    clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
  }
  .lb-chip .icon{width:11px; height:11px; flex-shrink:0;}
  .lb-chip b{color:var(--ink); font-weight:400; font-variant-numeric:tabular-nums;}
  .lb-chip.emphasis{border-color:var(--violet); color:var(--violet); box-shadow:0 0 10px rgba(166,133,255,.25);}
  .lb-chip.hot{border-color:var(--thrust); color:var(--thrust); box-shadow:0 0 10px rgba(57,255,138,.25); text-shadow:0 0 8px rgba(57,255,138,.3);}
  .lb-chip.cold{border-color:var(--danger); color:var(--danger); box-shadow:0 0 10px rgba(255,77,109,.25); text-shadow:0 0 8px rgba(255,77,109,.3);}

  .lb-expand-btn{
    display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
    background:none; border:none; clip-path:none; padding:0;
    font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.8px;
    color:var(--ink-dim); cursor:pointer;
  }
  .lb-expand-btn:hover{color:var(--cyan);}
  .lb-expand-btn .icon{width:11px; height:11px;}

  .lb-details{display:flex; flex-direction:column; gap:7px; padding-top:10px; border-top:1px solid var(--line-soft);}
  .lb-detail-row{display:flex; align-items:baseline; gap:8px; font-size:12.5px;}
  .lb-detail-row .lb-range-label{min-width:70px; flex-shrink:0;}
  .lb-detail-row b{font-family:var(--font-mono); font-weight:400; font-variant-numeric:tabular-nums; color:var(--ink);}
  .lb-detail-date{margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-dim);}

  .lb-range{
    display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;
    padding-top:10px; border-top:1px solid var(--line-soft);
  }
  .lb-range-label{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--ink-dim);}
  .lb-range .net{font-size:12.5px;}
  .lb-range-sep{color:var(--ink-dim); opacity:.5;}

  .leaderboard-sort{
    display:flex; gap:4px; margin-bottom:14px; padding:3px;
    background:var(--void-2); border:1px solid var(--line-soft);
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .leaderboard-sort .filter-btn{
    flex:1; background:none; border:none; clip-path:none;
    padding:8px 6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
    color:var(--ink-dim); cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .leaderboard-sort .filter-btn.active{background:linear-gradient(135deg, var(--violet), #5c3fa8); color:#150a2b;}

  .missions-lb-list{display:flex; flex-direction:column;}
  .missions-lb-row{display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line-soft);}
  .missions-lb-row:last-child{border-bottom:none;}
  .missions-lb-name{flex:1; font-family:var(--font-display); font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .missions-lb-count{
    display:flex; align-items:baseline; gap:5px;
    font-family:var(--font-mono); font-weight:700; font-size:17px; color:var(--cyan);
    font-variant-numeric:tabular-nums; text-shadow:0 0 10px rgba(77,238,234,.3);
  }
  .missions-lb-unit{font-family:var(--font-mono); font-weight:400; font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-dim); text-shadow:none;}

  .session-summary .title-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:10px;}
  .session-summary .title{font-family:var(--font-display); font-weight:700; font-size:13.5px; letter-spacing:.3px; text-transform:uppercase;}
  .session-summary .date{font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); white-space:nowrap;}

  .empty{color:var(--ink-dim); font-size:13.5px; text-align:center; padding:30px 10px; font-family:var(--font-mono); letter-spacing:.3px;}
  .empty .icon{width:32px; height:32px; color:var(--line); margin-bottom:10px;}

  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(5,7,13,.95); backdrop-filter:blur(10px);
    border-top:1px solid var(--line-soft);
    box-shadow:0 -6px 24px rgba(0,0,0,.5);
    display:flex;
  }
  nav.tabs button{
    flex:1; background:none; border:none; clip-path:none; text-transform:none; letter-spacing:.3px;
    padding:11px 4px 9px; color:var(--ink-dim); font-size:11px; font-weight:600; font-family:var(--font-body);
    display:flex; flex-direction:column; align-items:center; gap:4px; position:relative;
  }
  nav.tabs button .icon{width:20px; height:20px;}
  nav.tabs button.active{color:var(--cyan);}
  nav.tabs button.active .icon{ filter:drop-shadow(0 0 6px rgba(77,238,234,.65)); }
  nav.tabs button.active::before{
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:28px; height:2px; background:var(--cyan); box-shadow:0 0 8px var(--cyan);
  }

  .titlebar-input{
    background:transparent; border:none; color:var(--ink); font-family:var(--font-display);
    font-size:15px; font-weight:700; letter-spacing:.4px; padding:2px 0; width:100%; text-transform:uppercase;
  }
  .titlebar-input:focus{outline:none; border-bottom:1px solid var(--cyan);}

  .hint{font-size:11.5px; color:var(--ink-dim); text-align:center; margin-top:8px; font-family:var(--font-mono);}

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(4px);
    background:var(--panel-2); color:var(--cyan); border:1px solid var(--cyan);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    padding:10px 18px;
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:.5px; text-transform:uppercase;
    box-shadow:0 0 20px rgba(77,238,234,.35); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  /* ---------- In-app confirm/alert modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(5,7,13,.78); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    position:relative;
    width:100%; max-width:360px;
    background:linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%), var(--panel-2);
    border:1px solid var(--line);
    clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
    box-shadow:var(--shadow), 0 0 32px rgba(77,238,234,.14);
    padding:30px 22px 22px;
    text-align:center;
    animation:modalIn .22s ease-out both;
  }
  .modal-box.danger{ box-shadow:var(--shadow), 0 0 32px rgba(255,77,109,.2); }
  @keyframes modalIn{ 0%{opacity:0; transform:translateY(10px) scale(.97);} 100%{opacity:1; transform:none;} }
  .modal-icon{
    position:relative;
    width:66px; height:66px; margin:0 auto 16px;
    color:var(--cyan);
    filter:drop-shadow(0 0 14px rgba(77,238,234,.55));
    animation:modalFloat 3.5s ease-in-out infinite;
  }
  .modal-icon.danger{ color:var(--danger); filter:none; animation:none; }
  .modal-icon svg{width:100%; height:100%;}
  #modalIconSingle{display:block;}
  .modal-icon.danger #modalIconSingle{display:none;}
  @keyframes modalFloat{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-5px) rotate(5deg);} }

  /* ---------- Danger icon: an animated ship/asteroid collision loop ---------- */
  .collision-scene{ display:none; position:absolute; inset:0; }
  .modal-icon.danger .collision-scene{ display:block; }
  .collision-ship, .collision-rock{
    position:absolute; top:50%; left:50%; width:24px; height:24px; margin:-12px 0 0 -12px;
    transform-origin:50% 50%;
  }
  .collision-ship{ color:var(--cyan); filter:drop-shadow(0 0 6px rgba(77,238,234,.65)); animation:collideShip 2.8s cubic-bezier(.4,0,.2,1) infinite; }
  .collision-rock{ color:#8a97b8; filter:drop-shadow(0 0 5px rgba(0,0,0,.4)); animation:collideRock 2.8s cubic-bezier(.4,0,.2,1) infinite; }
  .collision-flash{
    position:absolute; top:50%; left:50%; width:38px; height:38px; margin:-19px 0 0 -19px;
    border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, #fff 0%, var(--amber) 40%, rgba(255,180,84,0) 72%);
    opacity:0; transform:scale(0);
    animation:collideFlash 2.8s cubic-bezier(.4,0,.2,1) infinite;
  }
  .debris{
    position:absolute; top:50%; left:50%; width:3.5px; height:3.5px; margin:-1.75px 0 0 -1.75px;
    border-radius:50%; background:var(--amber); opacity:0;
    animation-duration:2.8s; animation-timing-function:ease-out; animation-iteration-count:infinite;
  }
  .debris.d1{ animation-name:debris1; }
  .debris.d2{ animation-name:debris2; }
  .debris.d3{ animation-name:debris3; }
  .debris.d4{ animation-name:debris4; }
  .debris.d5{ animation-name:debris5; background:var(--cyan); }

  @keyframes collideShip{
    0%{ transform:translate(-26px,-8px) rotate(52deg); opacity:1; }
    38%{ transform:translate(-3px,-1px) rotate(52deg); opacity:1; }
    44%{ transform:translate(0,0) rotate(52deg) scale(.5); opacity:0; }
    100%{ transform:translate(-26px,-8px) rotate(52deg); opacity:0; }
  }
  @keyframes collideRock{
    0%{ transform:translate(26px,8px) rotate(0deg); opacity:1; }
    38%{ transform:translate(3px,1px) rotate(190deg); opacity:1; }
    44%{ transform:translate(0,0) rotate(230deg) scale(.5); opacity:0; }
    100%{ transform:translate(26px,8px) rotate(0deg); opacity:0; }
  }
  @keyframes collideFlash{
    0%,36%{ opacity:0; transform:scale(0); }
    42%{ opacity:1; transform:scale(.55); }
    58%{ opacity:0; transform:scale(1.7); }
    100%{ opacity:0; transform:scale(0); }
  }
  @keyframes debris1{ 0%,40%{opacity:0; transform:translate(0,0);} 46%{opacity:1;} 68%{opacity:0; transform:translate(-20px,-15px);} 100%{opacity:0; transform:translate(0,0);} }
  @keyframes debris2{ 0%,40%{opacity:0; transform:translate(0,0);} 46%{opacity:1;} 68%{opacity:0; transform:translate(19px,-13px);} 100%{opacity:0; transform:translate(0,0);} }
  @keyframes debris3{ 0%,40%{opacity:0; transform:translate(0,0);} 46%{opacity:1;} 68%{opacity:0; transform:translate(-14px,17px);} 100%{opacity:0; transform:translate(0,0);} }
  @keyframes debris4{ 0%,40%{opacity:0; transform:translate(0,0);} 46%{opacity:1;} 68%{opacity:0; transform:translate(16px,16px);} 100%{opacity:0; transform:translate(0,0);} }
  @keyframes debris5{ 0%,40%{opacity:0; transform:translate(0,0);} 46%{opacity:1;} 68%{opacity:0; transform:translate(1px,-22px);} 100%{opacity:0; transform:translate(0,0);} }
  .modal-title{font-family:var(--font-display); font-weight:800; font-size:16px; letter-spacing:.5px; color:var(--ink); margin-bottom:10px; text-transform:uppercase;}
  .modal-message{font-size:14.5px; color:var(--ink-dim); line-height:1.5; margin-bottom:8px;}
  .modal-text-wrap{margin:12px 0 4px;}
  .modal-text-wrap textarea{
    width:100%; min-height:100px; resize:vertical;
    background:var(--void-2); border:1px solid var(--line); color:var(--ink);
    font-family:var(--font-mono); font-size:12px; padding:10px; outline:none;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .modal-actions{display:flex; gap:10px; justify-content:center; margin-top:20px;}
  .modal-actions button{flex:1; justify-content:center;}

  ::placeholder{color:#4a5c82;}
</style>
</head>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "stardust_poker_tracker_v1";
  const LEGACY_STORAGE_KEY = "mines_poker_tracker_v1";
  const ACTIVE_TAB_KEY = "stardust_active_tab_v1";
  const TABS = ["dashboard", "tonight", "history", "leaderboard", "data"];
  let db = loadDB();
  let activeTab = TABS.includes(localStorage.getItem(ACTIVE_TAB_KEY)) ? localStorage.getItem(ACTIVE_TAB_KEY) : "dashboard";
  let buyinMenuPlayer = null;
  let cashoutMenuPlayer = null;
  let editingSessionId = null;
  let leaderboardSort = "net";
  let leaderboardSearch = "";
  let historyDateFrom = "";
  let historyDateTo = "";
  let expandedSessions = new Set();
  let expandedDashboardPlayers = new Set();
  let expandedLeaderboardPlayers = new Set();
  let playerSuggestInputEl = null;
  let playerSuggestEditingId = null;
  let editingRosterPlayerId = null;
  const CHIP_DENOMS = [
    { cents:10,  label:"10&cent;", cls:"chip-10c" },
    { cents:25,  label:"25&cent;", cls:"chip-25c" },
    { cents:50,  label:"50&cent;", cls:"chip-50c" },
    { cents:100, label:"$1",       cls:"chip-1" },
    { cents:500, label:"$5",       cls:"chip-5" },
  ];

  function loadDB(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
      const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
      if(legacyRaw){
        localStorage.setItem(STORAGE_KEY, legacyRaw);
        return JSON.parse(legacyRaw);
      }
    }catch(e){ console.error("Failed to load data", e); }
    return { players: [], sessions: [], currentSessionId: null };
  }
  function saveDB(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }
  function uid(){
    return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
  }
  function money(n){
    const v = Math.round((n + Number.EPSILON) * 100) / 100;
    const sign = v < 0 ? "-" : "";
    return sign + "$" + Math.abs(v).toLocaleString(undefined, {minimumFractionDigits: v % 1 === 0 ? 0 : 2, maximumFractionDigits: 2});
  }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
  }
  function dateInputValueToIso(val){
    return new Date(val + "T12:00:00").toISOString();
  }

  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function dateParts(iso){
    const d = new Date(iso);
    return { day: d.getDate(), month: d.getMonth() + 1, year: d.getFullYear() };
  }

  function partsFromDateStr(str){
    if(!str) return { day: "", month: new Date().getMonth() + 1, year: "" };
    const [y, m, d] = str.split("-").map(Number);
    return { day: d, month: m, year: y };
  }

  function renderDateFields(idPrefix, parts, extraClass){
    const monthVal = parts.month || (new Date().getMonth() + 1);
    return `
      <span class="date-fields ${extraClass || ""}" data-date-group="${idPrefix}">
        <input type="text" inputmode="numeric" maxlength="2" class="date-day" id="${idPrefix}-day" placeholder="DD" value="${parts.day || ""}">
        <span class="date-sep">/</span>
        <select class="date-month" id="${idPrefix}-month">
          ${MONTH_NAMES.map((m,i) => `<option value="${i+1}" ${i+1===monthVal?"selected":""}>${m}</option>`).join("")}
        </select>
        <span class="date-sep">/</span>
        <input type="text" inputmode="numeric" maxlength="4" class="date-year" id="${idPrefix}-year" placeholder="YYYY" value="${parts.year || ""}">
      </span>
    `;
  }

  function readDateFieldsValue(idPrefix){
    const dayEl = document.getElementById(idPrefix + "-day");
    const monthEl = document.getElementById(idPrefix + "-month");
    const yearEl = document.getElementById(idPrefix + "-year");
    if(!dayEl || !monthEl || !yearEl) return "";
    const day = parseInt(dayEl.value, 10);
    const month = parseInt(monthEl.value, 10);
    const year = parseInt(yearEl.value, 10);
    if(!day || !month || !year || String(yearEl.value).length < 4) return "";
    const pad = n => String(n).padStart(2, "0");
    return `${year}-${pad(month)}-${pad(day)}`;
  }

  function bindDateFieldsChange(idPrefix, onChange){
    ["day","month","year"].forEach(part => {
      const el = document.getElementById(idPrefix + "-" + part);
      if(el) el.addEventListener("change", () => {
        const val = readDateFieldsValue(idPrefix);
        if(val) onChange(val);
      });
    });
  }
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove("show"), 1800);
  }

  /* ---------- In-app confirm/alert modal (replaces window.confirm/alert/prompt) ---------- */
  function closeModal(result){
    const overlay = document.getElementById("modalOverlay");
    overlay.classList.remove("open");
    const resolver = overlay._resolve;
    overlay._resolve = null;
    if(resolver) resolver(result);
  }

  function openModal(opts){
    closeAllPopovers();
    return new Promise(resolve => {
      const overlay = document.getElementById("modalOverlay");
      const box = document.getElementById("modalBox");
      const danger = !!opts.danger;
      document.getElementById("modalTitle").textContent = opts.title || "";
      document.getElementById("modalMessage").textContent = opts.message || "";
      document.getElementById("modalMessage").hidden = !opts.message;
      document.getElementById("modalIconUse").setAttribute("href", "#icon-" + (opts.icon || (danger ? "asteroid" : "orbit")));
      document.getElementById("modalIconBox").classList.toggle("danger", danger);
      box.classList.toggle("danger", danger);

      const textWrap = document.getElementById("modalTextWrap");
      const textArea = document.getElementById("modalTextArea");
      if(opts.textValue !== undefined && opts.textValue !== null){
        textWrap.hidden = false;
        textArea.value = opts.textValue;
      }else{
        textWrap.hidden = true;
        textArea.value = "";
      }

      const okBtn = document.getElementById("modalOkBtn");
      const cancelBtn = document.getElementById("modalCancelBtn");
      okBtn.textContent = opts.okText || "OK";
      okBtn.className = danger ? "btn-danger" : "btn-primary";
      cancelBtn.textContent = opts.cancelText || "Cancel";
      cancelBtn.style.display = opts.showCancel === false ? "none" : "";

      overlay._resolve = resolve;
      overlay.classList.add("open");
      if(!textWrap.hidden){ textArea.focus(); textArea.select(); }
      else (opts.showCancel === false ? okBtn : cancelBtn).focus();
    });
  }

  function showConfirm(message, opts = {}){
    return openModal({
      message,
      title: opts.title || (opts.danger ? "Confirm Deletion" : "Confirm"),
      icon: opts.icon,
      danger: opts.danger,
      okText: opts.okText,
      cancelText: opts.cancelText,
      showCancel: true
    });
  }

  function showAlert(message, opts = {}){
    return openModal({
      message,
      title: opts.title || "Notice",
      icon: opts.icon || "warning",
      danger: opts.danger,
      okText: opts.okText || "OK",
      showCancel: false
    });
  }

  function showTextModal(text, opts = {}){
    return openModal({
      message: opts.message || "",
      title: opts.title || "Summary",
      icon: opts.icon || "orbit",
      okText: opts.okText || "Close",
      showCancel: false,
      textValue: text
    });
  }

  function getPlayer(id){ return db.players.find(p => p.id === id); }

  function getCurrentSession(){
    if(!db.currentSessionId) return null;
    return db.sessions.find(s => s.id === db.currentSessionId) || null;
  }
  function ensureCurrentSession(){
    let s = getCurrentSession();
    if(s) return s;
    s = {
      id: uid(),
      title: "Poker Night — " + new Date().toLocaleDateString('en-US',{month:'short', day:'numeric'}),
      date: new Date().toISOString(),
      entries: [],
      finished: false
    };
    db.sessions.push(s);
    db.currentSessionId = s.id;
    return s;
  }

  function sessionEntry(session, playerId){
    return session.entries.find(e => e.playerId === playerId);
  }

  function computeSessionTotals(session){
    let totalBuyIn = 0, totalCashOut = 0, cashedCount = 0;
    session.entries.forEach(e => {
      totalBuyIn += e.buyIns.reduce((a,b)=>a+b, 0);
      if(e.cashOut !== null && e.cashOut !== undefined){
        totalCashOut += e.cashOut;
        cashedCount++;
      }
    });
    return { totalBuyIn, totalCashOut, cashedCount, total: session.entries.length, allCashedOut: session.entries.length > 0 && cashedCount === session.entries.length };
  }

  function entryNet(entry){
    const buyIn = entry.buyIns.reduce((a,b)=>a+b,0);
    if(entry.cashOut === null || entry.cashOut === undefined) return -buyIn;
    return entry.cashOut - buyIn;
  }

  function computeLifetimeStats(){
    const stats = {};
    db.players.forEach(p => {
      stats[p.id] = { playerId:p.id, name:p.name, nights:0, totalBuyIn:0, totalCashOut:0, net:0, best:null, bestDate:null, worst:null, worstDate:null, streak:0, streakType:null };
    });
    const finishedSessions = db.sessions.filter(s => s.finished)
      .slice()
      .sort((a,b) => new Date(a.date) - new Date(b.date));
    finishedSessions.forEach(session => {
      session.entries.forEach(e => {
        const s = stats[e.playerId];
        if(!s) return;
        const buyIn = e.buyIns.reduce((a,b)=>a+b,0);
        const cashOut = e.cashOut ?? 0;
        const net = cashOut - buyIn;
        s.nights += 1;
        s.totalBuyIn += buyIn;
        s.totalCashOut += cashOut;
        s.net += net;
        if(s.best === null || net > s.best){ s.best = net; s.bestDate = session.date; }
        if(s.worst === null || net < s.worst){ s.worst = net; s.worstDate = session.date; }

        const type = net > 0 ? "win" : net < 0 ? "loss" : null;
        if(type && type === s.streakType) s.streak += 1;
        else { s.streakType = type; s.streak = type ? 1 : 0; }
      });
    });
    return Object.values(stats)
      .filter(s => s.nights > 0)
      .sort((a,b) => b.net - a.net);
  }

  // ---------- Actions ----------

  function addPlayerToSession(name){
    name = name.trim();
    if(!name) return;
    let player = db.players.find(p => p.name.toLowerCase() === name.toLowerCase());
    if(!player){
      player = { id: uid(), name };
      db.players.push(player);
    }else if(player.archived){
      player.archived = false;
    }
    const session = ensureCurrentSession();
    if(sessionEntry(session, player.id)){
      toast(name + " already aboard");
      return;
    }
    session.entries.push({ playerId: player.id, buyIns: [], cashOut: null });
    saveDB();
    render();
  }

  function addPlayerToRoster(name){
    name = name.trim();
    if(!name) return;
    let player = db.players.find(p => p.name.toLowerCase() === name.toLowerCase());
    if(player){
      if(player.archived){
        player.archived = false;
        saveDB();
        toast(name + " added back to roster");
        render();
      }else{
        toast(name + " already in roster");
      }
      return;
    }
    db.players.push({ id: uid(), name });
    saveDB();
    toast(name + " added");
    render();
  }

  function removePlayerFromSession(playerId){
    const session = getCurrentSession();
    if(!session) return;
    session.entries = session.entries.filter(e => e.playerId !== playerId);
    saveDB();
    render();
  }

  function renamePlayer(playerId, newName){
    const player = getPlayer(playerId);
    if(!player) return;
    const trimmed = newName.trim();
    if(!trimmed || trimmed === player.name) return;
    player.name = trimmed;
    saveDB();
    toast("Player renamed");
  }

  async function archivePlayer(playerId){
    const player = getPlayer(playerId);
    if(!player) return;
    const ok = await showConfirm(`Remove "${player.name}" from the name suggestions? This can't be undone. Their past game history stays intact.`, { danger:true, title:"Remove Player", okText:"Remove" });
    if(!ok) return;
    player.archived = true;
    saveDB();
    render();
  }

  function addBuyIn(playerId, amount){
    const session = getCurrentSession();
    if(!session) return;
    const entry = sessionEntry(session, playerId);
    if(!entry || amount <= 0) return;
    entry.buyIns.push(amount);
    saveDB();
    render();
  }

  function undoLastBuyIn(playerId){
    const session = getCurrentSession();
    if(!session) return;
    const entry = sessionEntry(session, playerId);
    if(!entry || entry.buyIns.length === 0) return;
    entry.buyIns.pop();
    saveDB();
    render();
  }

  function setCashOut(playerId, amount){
    const session = getCurrentSession();
    if(!session) return;
    const entry = sessionEntry(session, playerId);
    if(!entry) return;
    entry.cashOut = amount;
    saveDB();
    render();
  }

  function reopenPlayer(playerId){
    const session = getCurrentSession();
    if(!session) return;
    const entry = sessionEntry(session, playerId);
    if(!entry) return;
    entry.cashOut = null;
    saveDB();
    render();
  }

  async function finishNight(){
    const session = getCurrentSession();
    if(!session || session.entries.length === 0) return;
    const totals = computeSessionTotals(session);
    if(!totals.allCashedOut){
      const ok = await showConfirm("Not everyone has cashed out yet. Finish the night anyway?", { icon:"orbit", title:"Finish Night", okText:"Finish Anyway" });
      if(!ok) return;
    }
    session.finished = true;
    db.currentSessionId = null;
    saveDB();
    toast("Night logged to History");
    activeTab = "history";
    render();
  }

  async function deleteSession(sessionId){
    const ok = await showConfirm("Delete this night? This can't be undone.", { danger:true, title:"Delete Night", okText:"Delete" });
    if(!ok) return;
    db.sessions = db.sessions.filter(s => s.id !== sessionId);
    if(db.currentSessionId === sessionId) db.currentSessionId = null;
    saveDB();
    render();
  }

  async function removeEntryFromHistorySession(sessionId, playerId){
    const session = db.sessions.find(s => s.id === sessionId);
    if(!session) return;
    const ok = await showConfirm("Remove this player's record from this night?", { danger:true, title:"Remove Record", okText:"Remove" });
    if(!ok) return;
    session.entries = session.entries.filter(e => e.playerId !== playerId);
    saveDB();
    render();
  }

  function saveSessionEdit(sessionId){
    const session = db.sessions.find(s => s.id === sessionId);
    if(!session) return;

    const titleInput = document.getElementById("editTitle-" + sessionId);
    if(titleInput){
      const val = titleInput.value.trim();
      if(val) session.title = val;
    }

    const dateVal = readDateFieldsValue("editDate-" + sessionId);
    if(dateVal){
      session.date = dateInputValueToIso(dateVal);
    }

    session.entries.forEach(e => {
      const buyInInput = document.querySelector(`.edit-buyin[data-session="${sessionId}"][data-entry="${e.playerId}"]`);
      const cashOutInput = document.querySelector(`.edit-cashout[data-session="${sessionId}"][data-entry="${e.playerId}"]`);
      if(buyInInput){
        const v = parseFloat(buyInInput.value);
        e.buyIns = [(!isNaN(v) && v >= 0) ? v : 0];
      }
      if(cashOutInput){
        const raw = cashOutInput.value.trim();
        if(raw === ""){
          e.cashOut = null;
        }else{
          const v = parseFloat(raw);
          e.cashOut = (!isNaN(v) && v >= 0) ? v : null;
        }
      }
    });

    editingSessionId = null;
    saveDB();
    toast("Night updated");
    render();
  }

  function copySummary(){
    const session = getCurrentSession();
    if(!session) return;
    const totals = computeSessionTotals(session);
    let lines = [session.title, fmtDate(session.date), ""];
    session.entries.forEach(e => {
      const p = getPlayer(e.playerId);
      const net = entryNet(e);
      const status = (e.cashOut === null || e.cashOut === undefined) ? " (still playing)" : "";
      lines.push(`${p.name}: ${net >= 0 ? "+" : ""}${money(net)}${status}`);
    });
    lines.push("");
    lines.push(`Total buy-ins: ${money(totals.totalBuyIn)}  |  Total cash-outs: ${money(totals.totalCashOut)}`);
    if(session.anomalyNote) lines.push(`Anomaly note: ${session.anomalyNote}`);
    const text = lines.join("\n");
    navigator.clipboard?.writeText(text).then(()=>toast("Summary copied")).catch(()=>{
      showTextModal(text, { title:"Copy Summary", message:"Couldn't auto-copy — select the text below and copy it manually." });
    });
  }

  function exportData(){
    const blob = new Blob([JSON.stringify(db, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `stardust-poker-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function importData(file){
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.players || !parsed.sessions) throw new Error("Not a valid backup file");
        const ok = await showConfirm("This will replace all current data with the imported backup. Continue?", { danger:true, title:"Import Backup", okText:"Import" });
        if(!ok) return;
        db = parsed;
        db.currentSessionId = db.currentSessionId || null;
        saveDB();
        toast("Data imported");
        render();
      }catch(e){
        showAlert("Couldn't import that file: " + e.message, { title:"Import Failed" });
      }
    };
    reader.readAsText(file);
  }

  // ---------- Rendering ----------

  function render(){
    closeAllPopovers();
    localStorage.setItem(ACTIVE_TAB_KEY, activeTab);
    document.querySelectorAll("nav.tabs button").forEach(b => {
      b.classList.toggle("active", b.dataset.tab === activeTab);
    });
    const main = document.getElementById("main");
    if(activeTab === "dashboard") main.innerHTML = renderDashboard();
    else if(activeTab === "tonight") main.innerHTML = renderTonight();
    else if(activeTab === "history") main.innerHTML = renderHistory();
    else if(activeTab === "leaderboard") main.innerHTML = renderLeaderboard();
    else if(activeTab === "data") main.innerHTML = renderData();
    bindDynamicEvents();
    updateStatusLight();
  }

  function updateStatusLight(){
    const light = document.getElementById("statusLight");
    const session = getCurrentSession();
    const active = !!(session && session.entries.length > 0 && !session.finished);
    light.classList.toggle("live", active);
  }

  function bracketDecor(){
    return `<span class="bracket tr"></span><span class="bracket bl"></span>`;
  }

  /* ---------- Popover positioning (shared) ---------- */
  function positionPopover(menu, triggerEl){
    const rect = triggerEl.getBoundingClientRect();
    const margin = 10;
    const bottomReserved = 76; // clears the fixed bottom tab bar
    // Use the visual viewport (not window.innerWidth/Height) so this stays
    // correct on phones once the on-screen keyboard shrinks the visible
    // area — window.innerHeight doesn't reflect that on iOS Safari, and a
    // position:fixed box needs the visual viewport's offset too, since it's
    // otherwise placed relative to the (keyboard-unaware) layout viewport.
    const vv = window.visualViewport;
    const vpLeft = vv ? vv.offsetLeft : 0;
    const vpTop = vv ? vv.offsetTop : 0;
    const vpWidth = vv ? vv.width : window.innerWidth;
    const vpHeight = vv ? vv.height : window.innerHeight;

    let left = rect.left;
    if(left + menu.offsetWidth > vpLeft + vpWidth - margin) left = vpLeft + vpWidth - margin - menu.offsetWidth;
    if(left < vpLeft + margin) left = vpLeft + margin;
    let top = rect.bottom + 8;
    if(top + menu.offsetHeight > vpTop + vpHeight - bottomReserved){
      top = rect.top - menu.offsetHeight - 8;
      if(top < vpTop + margin) top = vpTop + margin;
    }
    menu.style.left = left + "px";
    menu.style.top = top + "px";
  }

  function openCashOutMenuFor(playerId, triggerEl){
    const session = getCurrentSession();

    }
    cashoutMenuPlayer = playerId;

    const rowsHtml = CHIP_DENOMS.map(d => `
      <div class="cashout-menu-row">
        <span class="chip-badge ${d.cls}"></span>
        <label for="chip-${d.cents}-${p.id}">${d.label}</label>
        <input type="number" class="chip-count" id="chip-${d.cents}-${p.id}" data-cents="${d.cents}" min="0" step="1" inputmode="numeric" placeholder="0">

      </div>
    `).join("");

    menu.innerHTML = `
      <button type="button" class="buyin-menu-close" data-menu-close aria-label="Close">&times;</button>
      <div class="buyin-menu-label">Cash out — ${escapeHtml(p.name)}</div>
      <div class="cashout-mode-toggle">
        <button type="button" class="mode-btn active" data-mode="chips">Count Chips</button>
        <button type="button" class="mode-btn" data-mode="manual">Manual</button>
      </div>
      <div class="cashout-mode-panel" data-mode-panel="chips">
        ${rowsHtml}
        <div class="cashout-menu-total">
          <span class="label">Total</span>
          <span class="value" id="cashoutMenuTotal">$0.00</span>
        </div>
      </div>
      <div class="cashout-mode-panel" data-mode-panel="manual" hidden>
        <div class="buyin-menu-label">Exact cash-out amount</div>
        <input type="number" id="cashoutManualAmount" placeholder="0.00" min="0" step="0.01">
      </div>
      <button class="btn-cashout" type="button" data-menu-confirm-cashout style="width:100%; justify-content:center; margin-top:12px;">
        <svg class="icon"><use href="#icon-check"/></svg>Confirm Cash Out
      </button>
    `;

    let mode = "chips";
    const chipsPanel = menu.querySelector('[data-mode-panel="chips"]');
    const manualPanel = menu.querySelector('[data-mode-panel="manual"]');
    const manualInput = menu.querySelector("#cashoutManualAmount");
    const inputs = Array.from(menu.querySelectorAll(".chip-count"));
    const totalEl = menu.querySelector("#cashoutMenuTotal");
    const recalc = () => {
      let totalCents = 0;
      inputs.forEach(inp => {
        const count = parseInt(inp.value, 10);
        const cents = parseInt(inp.dataset.cents, 10);
        const safeCount = (!isNaN(count) && count > 0) ? count : 0;
        const subCents = safeCount * cents;
        totalCents += subCents;
        const subEl = menu.querySelector(`[data-subtotal-for="${cents}"]`);
        if(subEl) subEl.textContent = money(subCents / 100);
      });
      totalEl.textContent = money(totalCents / 100);
      return totalCents;
    };
    inputs.forEach(inp => inp.addEventListener("input", recalc));
    recalc();

    menu.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        mode = btn.dataset.mode;
        menu.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
        chipsPanel.hidden = mode !== "chips";
        manualPanel.hidden = mode !== "manual";
        positionPopover(menu, triggerEl);
        if(mode === "manual") manualInput.focus(); else inputs[0]?.focus();
      });
    });

    menu.querySelector("[data-menu-confirm-cashout]").addEventListener("click", () => {
      if(mode === "manual"){
        const amount = parseFloat(manualInput.value);
        if(isNaN(amount) || amount < 0){ manualInput.focus(); return; }
        setCashOut(playerId, amount);
      }else{
        setCashOut(playerId, recalc() / 100);
      }
    });
    menu.querySelector("[data-menu-close]").addEventListener("click", closeCashOutMenu);

    menu.classList.add("open");
    positionPopover(menu, triggerEl);
    if(inputs[0]) inputs[0].focus();
  }

  /* ---------- Player name suggestion dropdown ---------- */
  function closePlayerSuggest(){
    const box = document.getElementById("playerSuggest");

  function refreshPlayerSuggest(){
    if(!playerSuggestInputEl) return;
    const box = document.getElementById("playerSuggest");
    if(!box) return;

    const query = playerSuggestInputEl.value.trim().toLowerCase();
    const matches = db.players
      .filter(p => !p.archived)
      .filter(p => !query || p.name.toLowerCase().includes(query))
      .sort((a,b) => a.name.localeCompare(b.name))
      .slice(0, 8);

    box.innerHTML = matches.length === 0
      ? `<div class="suggest-empty">No matches</div>`
      : matches.map(p => {
          if(playerSuggestEditingId === p.id){
            return `
              <div class="suggest-row editing">
                <input type="text" class="suggest-edit-input" id="suggestEdit-${p.id}" value="${escapeHtml(p.name)}">
                <button type="button" class="suggest-icon-btn" data-suggest-save="${p.id}" aria-label="Save"><svg class="icon"><use href="#icon-check"/></svg></button>
                <button type="button" class="suggest-icon-btn" data-suggest-cancel-edit aria-label="Cancel"><svg class="icon"><use href="#icon-x"/></svg></button>
              </div>
            `;
          }
          return `
            <div class="suggest-row">
              <span class="suggest-name" data-suggest-pick="${p.id}">${escapeHtml(p.name)}</span>
              <button type="button" class="suggest-icon-btn" data-suggest-edit="${p.id}" aria-label="Edit"><svg class="icon"><use href="#icon-edit"/></svg></button>
              <button type="button" class="suggest-icon-btn danger" data-suggest-remove="${p.id}" aria-label="Remove"><svg class="icon"><use href="#icon-x"/></svg></button>
            </div>
          `;
        }).join("");

    box.querySelectorAll("[data-suggest-pick]").forEach(el => {
      el.addEventListener("pointerdown", e => {
        e.preventDefault(); // stop the input from blurring before the pick registers (mobile double-tap fix)
        const p = getPlayer(el.dataset.suggestPick);
        const input = playerSuggestInputEl;
        if(p && input) input.value = p.name;
        closePlayerSuggest();
        if(input) input.focus();
      });
    });
    box.querySelectorAll("[data-suggest-edit]").forEach(el => {
      el.addEventListener("pointerdown", e => {
        e.preventDefault();
        e.stopPropagation();
        playerSuggestEditingId = el.dataset.suggestEdit;
        refreshPlayerSuggest();
        const inp = document.getElementById("suggestEdit-" + playerSuggestEditingId);
        if(inp){ inp.focus(); inp.select(); }
      });
    });
    box.querySelectorAll("[data-suggest-remove]").forEach(el => {
      el.addEventListener("pointerdown", e => {
        e.preventDefault();
        e.stopPropagation();
        const p = getPlayer(el.dataset.suggestRemove);
        if(p){ p.archived = true; saveDB(); }
        refreshPlayerSuggest();
      });
    });
    box.querySelectorAll("[data-suggest-save]").forEach(el => {
      el.addEventListener("pointerdown", e => {
        e.preventDefault();
        e.stopPropagation();
        const id = el.dataset.suggestSave;
        const inp = document.getElementById("suggestEdit-" + id);
        if(inp) renamePlayer(id, inp.value);
        playerSuggestEditingId = null;
        refreshPlayerSuggest();
      });
    });
    box.querySelectorAll("[data-suggest-cancel-edit]").forEach(el => {
      el.addEventListener("pointerdown", e => {
        e.preventDefault();
        e.stopPropagation();
        playerSuggestEditingId = null;
        refreshPlayerSuggest();
      });
    });
    const editInput = box.querySelector(".suggest-edit-input");
    if(editInput){
      editInput.addEventListener("pointerdown", e => e.stopPropagation());
      editInput.addEventListener("keydown", e => {
        if(e.key === "Enter"){
          e.preventDefault();
          renamePlayer(playerSuggestEditingId, editInput.value);
          playerSuggestEditingId = null;
          refreshPlayerSuggest();
        }else if(e.key === "Escape"){
          e.preventDefault();
          playerSuggestEditingId = null;
          refreshPlayerSuggest();
        }
      });
    }

    if(playerSuggestInputEl) positionPopover(box, playerSuggestInputEl);
  }

  function openPlayerSuggest(inputEl){
