<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mines Poker Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M12 2 L19 20 L12 16 L5 20 Z%22 fill=%22%234deeea%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05070d;
    --void-2:#070b14;
    --panel:#0b1220;
    --panel-2:#0f1830;
    --line:#223258;
    --line-soft:#182541;
    --cyan:#4deeea;
    --cyan-dim:#2a8f8c;
    --violet:#a685ff;
    --amber:#ffb454;
    --thrust:#39ff8a;
    --danger:#ff4d6d;
    --ink:#e9f2ff;
    --ink-dim:#7f92b8;
    --shadow:0 10px 30px rgba(0,0,0,.55);
    --glow-cyan:0 0 16px rgba(77,238,234,.35);
    --font-display:'Orbitron','Segoe UI',system-ui,sans-serif;
    --font-body:'Rajdhani','Segoe UI',system-ui,sans-serif;
    --font-mono:'Share Tech Mono','SFMono-Regular',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    min-height:100vh;
    padding-bottom:96px;
    position:relative;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
  }

  #starfield{ position:fixed; inset:0; z-index:-1; display:block; background:var(--void); }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(5,7,13,.96), rgba(5,7,13,.86));
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-soft);
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  header.top .brand{display:flex; align-items:center; gap:10px;}
  header.top .mark{width:26px; height:26px; color:var(--cyan); filter:drop-shadow(0 0 6px rgba(77,238,234,.6));}
  header.top h1{
    margin:0; font-family:var(--font-display); font-weight:800; font-size:19px;
    letter-spacing:1.5px; color:var(--ink);
    animation:powerOn .9s ease-out both;
  }
  header.top h1 .accent{color:var(--cyan);}
  header.top .sub{
    font-family:var(--font-mono); color:var(--ink-dim); font-size:10.5px;
    letter-spacing:1.2px; margin-top:2px; text-transform:uppercase;
  }
  @keyframes powerOn{
    0%{ opacity:0; letter-spacing:4px; text-shadow:0 0 0 transparent; }
    60%{ opacity:1; text-shadow:0 0 18px rgba(77,238,234,.7); }
    100%{ opacity:1; letter-spacing:1.5px; text-shadow:0 0 0 transparent; }
  }
  .status-light{
    width:10px; height:10px; border-radius:50%; background:var(--line);
    flex-shrink:0; transition:background .3s ease;
  }
  .status-light.live{
    background:var(--thrust);
    box-shadow:0 0 10px 3px rgba(57,255,138,.65);
    animation:pulse 1.7s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  main{max-width:640px; margin:0 auto; padding:18px 16px;}

  /* ---------- Panels ---------- */
  .card{
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 40%), var(--panel);
    border:1px solid var(--line);
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
    padding:18px;
    margin-bottom:16px;
  }
  .card .bracket{ position:absolute; width:14px; height:14px; pointer-events:none; opacity:.9; }
  .card .bracket.tr{ top:-1px; right:-1px; border-top:2px solid var(--cyan); border-right:2px solid var(--cyan); }
  .card .bracket.bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--cyan); border-left:2px solid var(--cyan); }

  .eyebrow{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:2.5px;
    color:var(--cyan-dim); text-transform:uppercase; margin:0 0 4px;
  }
  .card h2{
    margin:0 0 14px; font-family:var(--font-display); font-weight:700; font-size:14px;
    color:var(--ink); text-transform:uppercase; letter-spacing:1px;
  }

  input[type=text], input[type=number]{
    background:var(--void-2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--font-body);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    padding:10px 12px;
    font-size:15px;
    width:100%;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=number]{ font-family:var(--font-mono); }
  input[type=text]:focus, input[type=number]:focus{ border-color:var(--cyan); box-shadow:0 0 0 2px rgba(77,238,234,.15); }
  input:focus-visible{ outline:2px solid var(--cyan); outline-offset:1px; }

  button{
    font-family:var(--font-body);
    cursor:pointer;
    border:none;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
    padding:10px 16px;
    font-size:14px;
    font-weight:700;
    letter-spacing:.6px;
    text-transform:uppercase;
    display:inline-flex; align-items:center; gap:6px;
    transition:transform .06s ease, filter .15s ease, box-shadow .15s ease;
  }
  button:active{transform:scale(.96);}
  button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  button .icon{width:15px; height:15px; flex-shrink:0;}

  .btn-primary{background:linear-gradient(135deg, var(--cyan), var(--cyan-dim)); color:#04211f;}
  .btn-primary:hover{ box-shadow:var(--glow-cyan); filter:brightness(1.06); }
  .btn-ghost{background:var(--void-2); color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--cyan); color:var(--cyan);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(255,77,109,.5);}
  .btn-danger:hover{background:rgba(255,77,109,.1); box-shadow:0 0 12px rgba(255,77,109,.25);}
  .btn-sm{padding:7px 10px; font-size:11.5px;}
  .btn-chip{background:var(--void-2); color:var(--amber); border:1px solid rgba(255,180,84,.35); font-family:var(--font-mono); text-transform:none; letter-spacing:0;}
  .btn-chip:hover{border-color:var(--amber); box-shadow:0 0 10px rgba(255,180,84,.25);}
  button:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

  .row{display:flex; gap:8px;}
  .row.wrap{flex-wrap:wrap;}
  .row.between{justify-content:space-between; align-items:center;}
  .grow{flex:1;}

  /* ---------- Player readout ---------- */
  .player{
    position:relative;
    border:1px solid var(--line-soft);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    padding:13px;
    margin-bottom:10px;
    background:linear-gradient(180deg, rgba(77,238,234,.03), transparent 60%), var(--void-2);
  }
  .player.done{ opacity:.72; }
  .player .name-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px;}
  .player .name{font-family:var(--font-display); font-size:15px; font-weight:700; letter-spacing:.3px;}
  .player .status{
    font-family:var(--font-mono); font-size:10.5px; padding:3px 9px 3px 8px;
    display:inline-flex; align-items:center; letter-spacing:.8px; text-transform:uppercase;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    white-space:nowrap;
  }
  .status::before{ content:''; width:6px; height:6px; border-radius:50%; margin-right:6px; display:inline-block; }
  .status.playing{background:rgba(255,180,84,.1); color:var(--amber); border:1px solid rgba(255,180,84,.4);}
  .status.playing::before{background:var(--amber); animation:pulse 1.4s ease-in-out infinite;}
  .status.cashed{background:rgba(57,255,138,.1); color:var(--thrust); border:1px solid rgba(57,255,138,.4);}
  .status.cashed::before{background:var(--thrust);}

  .stat-line{display:flex; gap:16px; font-size:13px; color:var(--ink-dim); margin-bottom:10px; flex-wrap:wrap;}
  .stat-line b{color:var(--ink); font-family:var(--font-mono); font-weight:400; font-variant-numeric:tabular-nums;}
  .net{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .net.pos{color:var(--thrust); font-weight:700; text-shadow:0 0 10px rgba(57,255,138,.35);}
  .net.neg{color:var(--danger); font-weight:700; text-shadow:0 0 10px rgba(255,77,109,.35);}

  .quickbuy{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; align-items:center;}
  .cashout-row{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .cashout-row input{width:120px;}

  /* ---------- Balance / status banners ---------- */
  .balance-banner{
    position:relative;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    padding:12px 14px; margin-bottom:14px;
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:.3px; font-weight:400;
    display:flex; align-items:center; gap:10px; text-transform:uppercase;
  }
  .balance-banner .icon{width:18px; height:18px; flex-shrink:0;}
  .balance-banner.ok{background:rgba(57,255,138,.08); border:1px solid rgba(57,255,138,.4); color:var(--thrust);}
  .balance-banner.bad{background:rgba(255,77,109,.08); border:1px solid rgba(255,77,109,.4); color:var(--danger);}
  .balance-banner.info{background:rgba(77,238,234,.06); border:1px solid rgba(77,238,234,.3); color:var(--cyan);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{text-align:left; padding:9px 6px; border-bottom:1px solid var(--line-soft);}
  td{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  td:first-child{font-family:var(--font-body); font-weight:600;}
  th{color:var(--ink-dim); font-family:var(--font-mono); font-weight:400; font-size:10.5px; text-transform:uppercase; letter-spacing:1px;}
  tr:last-child td{border-bottom:none;}

  .bar-track{background:var(--void-2); border:1px solid var(--line-soft); height:9px; overflow:hidden; margin-top:6px; position:relative;}
  .bar-track::after{ content:''; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 9px, rgba(255,255,255,.04) 9px 10px); pointer-events:none; }
  .bar-fill{height:100%;}
  .bar-fill.pos{background:linear-gradient(90deg, var(--cyan-dim), var(--thrust)); box-shadow:0 0 8px rgba(57,255,138,.5);}
  .bar-fill.neg{background:linear-gradient(90deg, #7a1f30, var(--danger)); box-shadow:0 0 8px rgba(255,77,109,.5);}

  .rank-badge{
    width:30px; height:30px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:13px; color:var(--void);
    background:var(--ink-dim);
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  }
  .rank-badge.r1{background:var(--cyan); box-shadow:0 0 12px rgba(77,238,234,.55);}
  .rank-badge.r2{background:var(--violet); box-shadow:0 0 10px rgba(166,133,255,.4);}
  .rank-badge.r3{background:var(--amber); box-shadow:0 0 10px rgba(255,180,84,.35);}

  .session-summary .title-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:10px;}
  .session-summary .title{font-family:var(--font-display); font-weight:700; font-size:13.5px; letter-spacing:.3px;}
  .session-summary .date{font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); white-space:nowrap;}

  .empty{color:var(--ink-dim); font-size:13.5px; text-align:center; padding:30px 10px; font-family:var(--font-mono); letter-spacing:.3px;}
  .empty .icon{width:32px; height:32px; color:var(--line); margin-bottom:10px;}

  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(5,7,13,.95); backdrop-filter:blur(10px);
    border-top:1px solid var(--line-soft);
    box-shadow:0 -6px 24px rgba(0,0,0,.5);
    display:flex;
  }
  nav.tabs button{
    flex:1; background:none; border:none; clip-path:none; text-transform:none; letter-spacing:.3px;
    padding:11px 4px 9px; color:var(--ink-dim); font-size:11px; font-weight:600; font-family:var(--font-body);
    display:flex; flex-direction:column; align-items:center; gap:4px; position:relative;
  }
  nav.tabs button .icon{width:20px; height:20px;}
  nav.tabs button.active{color:var(--cyan);}
  nav.tabs button.active .icon{ filter:drop-shadow(0 0 6px rgba(77,238,234,.65)); }
  nav.tabs button.active::before{
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:28px; height:2px; background:var(--cyan); box-shadow:0 0 8px var(--cyan);
  }

  .titlebar-input{
    background:transparent; border:none; color:var(--ink); font-family:var(--font-display);
    font-size:15px; font-weight:700; letter-spacing:.4px; padding:2px 0; width:100%; text-transform:uppercase;
  }
  .titlebar-input:focus{outline:none; border-bottom:1px solid var(--cyan);}

  .hint{font-size:11.5px; color:var(--ink-dim); text-align:center; margin-top:8px; font-family:var(--font-mono);}

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(4px);
    background:var(--panel-2); color:var(--cyan); border:1px solid var(--cyan);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    padding:10px 18px;
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:.5px; text-transform:uppercase;
    box-shadow:0 0 20px rgba(77,238,234,.35); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  ::placeholder{color:#4a5c82;}
</style>
</head>
<body>

<canvas id="starfield" aria-hidden="true"></canvas>

<svg style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
<defs>
<symbol id="icon-mark" viewBox="0 0 24 24"><path d="M12 2 L19 20 L12 16 L5 20 Z" fill="currentColor"/></symbol>
<symbol id="icon-rocket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 2c3 2 5 6 5 10 0 2-1 4-2 5l-3 3-3-3c-1-1-2-3-2-5 0-4 2-8 5-10Z"/>
  <circle cx="12" cy="10" r="1.6"/>
  <path d="M9 16c-2 1-3 3-3 5 2 0 4-1 5-3"/>
  <path d="M15 16c2 1 3 3 3 5-2 0-4-1-5-3"/>
</symbol>
<symbol id="icon-radar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.2"/>
  <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
  <path d="M12 12 L18 7"/>
</symbol>
<symbol id="icon-medal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="14.5" r="6"/>
  <path d="M9.3 9 7 3 M14.7 9 17 3"/>
  <path d="M12 11.6 l1.1 2.2 2.4.4-1.8 1.7.4 2.4-2.1-1.1-2.1 1.1.4-2.4-1.8-1.7 2.4-.4Z" fill="currentColor" stroke="none"/>
</symbol>
<symbol id="icon-disk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/>
  <path d="M4.5 5.5v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"/>
  <path d="M4.5 11.5v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"/>
</symbol>
<symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="icon-bolt" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></symbol>
<symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></symbol>
<symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
<symbol id="icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 22 20H2Z"/><path d="M12 9.5v4.5"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></symbol>
<symbol id="icon-orbit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="4"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/></symbol>
<symbol id="icon-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 2.6 5.9"/><path d="M4 12V6M4 12h6"/></symbol>
<symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></symbol>
<symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></symbol>
<symbol id="icon-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/></symbol>
<symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></symbol>
<symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9"/><path d="M7 13l5-5 5 5"/><path d="M5 20h14"/></symbol>
<symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></symbol>
</defs>
</svg>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24"><use href="#icon-mark"/></svg>
    <div>
      <h1>MINES<span class="accent">.</span>POKER</h1>
      <div class="sub" id="headerSub">Telemetry // live table feed</div>
    </div>
  </div>
  <div class="status-light" id="statusLight" title="Session status"></div>
</header>

<main id="main"></main>

<nav class="tabs">
  <button data-tab="tonight" class="active"><svg class="icon"><use href="#icon-rocket"/></svg><span>Tonight</span></button>
  <button data-tab="history"><svg class="icon"><use href="#icon-radar"/></svg><span>History</span></button>
  <button data-tab="leaderboard"><svg class="icon"><use href="#icon-medal"/></svg><span>Leaderboard</span></button>
  <button data-tab="data"><svg class="icon"><use href="#icon-disk"/></svg><span>Data</span></button>
</nav>

<div class="toast" id="toast"></div>

<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "mines_poker_tracker_v1";
  let db = loadDB();
  let activeTab = "tonight";

  function loadDB(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ console.error("Failed to load data", e); }
    return { players: [], sessions: [], currentSessionId: null };
  }
  function saveDB(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }
  function uid(){
    return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
  }
  function money(n){
    const v = Math.round((n + Number.EPSILON) * 100) / 100;
    const sign = v < 0 ? "-" : "";
    return sign + "$" + Math.abs(v).toLocaleString(undefined, {minimumFractionDigits: v % 1 === 0 ? 0 : 2, maximumFractionDigits: 2});
  }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric', year:'numeric' });
  }
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove("show"), 1800);
  }

  function getPlayer(id){ return db.players.find(p => p.id === id); }

  function getCurrentSession(){
    if(!db.currentSessionId) return null;
    return db.sessions.find(s => s.id === db.currentSessionId) || null;
  }
  function ensureCurrentSession(){
    let s = getCurrentSession();
    if(s) return s;
    s = {
      id: uid(),
      title: "Poker Night — " + new Date().toLocaleDateString(undefined,{month:'short', day:'numeric'}),
      date: new Date().toISOString(),
      entries: [],
      finished: false
    };
    db.sessions.push(s);
    db.currentSessionId = s.id;
    return s;
  }

  function sessionEntry(session, playerId){
    return session.entries.find(e => e.playerId === playerId);
  }

  function computeSessionTotals(session){
    let totalBuyIn = 0, totalCashOut = 0, cashedCount = 0;
    session.entries.forEach(e => {
      totalBuyIn += e.buyIns.reduce((a,b)=>a+b, 0);
      if(e.cashOut !== null && e.cashOut !== undefined){
        totalCashOut += e.cashOut;
        cashedCount++;
      }
    });
    return { totalBuyIn, totalCashOut, cashedCount, total: session.entries.length, allCashedOut: session.entries.length > 0 && cashedCount === session.entries.length };
  }

  function entryNet(entry){
    const buyIn = entry.buyIns.reduce((a,b)=>a+b,0);
    if(entry.cashOut === null || entry.cashOut === undefined) return -buyIn;
    return entry.cashOut - buyIn;
  }

  function computeLifetimeStats(){
    const stats = {};
    db.players.forEach(p => {
      stats[p.id] = { playerId:p.id, name:p.name, nights:0, totalBuyIn:0, totalCashOut:0, net:0, best:null, worst:null };
    });
    db.sessions.forEach(session => {
      if(!session.finished) return;
      session.entries.forEach(e => {
        const s = stats[e.playerId];
        if(!s) return;
        const buyIn = e.buyIns.reduce((a,b)=>a+b,0);
        const cashOut = e.cashOut ?? 0;
        const net = cashOut - buyIn;
        s.nights += 1;
        s.totalBuyIn += buyIn;
        s.totalCashOut += cashOut;
        s.net += net;
        if(s.best === null || net > s.best) s.best = net;
        if(s.worst === null || net < s.worst) s.worst = net;
      });
    });
    return Object.values(stats).filter(s => s.nights > 0).sort((a,b) => b.net - a.net);
  }

  // ---------- Actions ----------

  function addPlayerToSession(name){
    name = name.trim();
    if(!name) return;
    let player = db.players.find(p => p.name.toLowerCase() === name.toLowerCase());
    if(!player){
      player = { id: uid(), name };
      db.players.push(player);
    }
    const session = ensureCurrentSession();
    if(sessionEntry(session, player.id)){
      toast(name + " already aboard");
      return;
    }
    session.entries.push({ playerId: player.id, buyIns: [], cashOut: null });
    saveDB();
    render();
  }

  function removePlayerFromSession(playerId){
    const session = getCurrentSession();
    if(!session) return;
    session.entries = session.entries.filter(e => e.playerId !== playerId);
    saveDB();
    render();
  }

  function addBuyIn(playerId, amount){
    const session = getCurrentSession();
    if(!session) return;
    const entry = sessionEntry(session, playerId);
    if(!entry || amount <= 0) return;
    entry.buyIns.push(amount);
    saveDB();
    render();
  }

  function undoLastBuyIn(playerId){
    const session = getCurrentSession();
    if(!session) return;
    const entry = sessionEntry(session, playerId);
    if(!entry || entry.buyIns.length === 0) return;
    entry.buyIns.pop();
    saveDB();
    render();
  }

  function setCashOut(playerId, amount){
    const session = getCurrentSession();
    if(!session) return;
    const entry = sessionEntry(session, playerId);
    if(!entry) return;
    entry.cashOut = amount;
    saveDB();
    render();
  }

  function reopenPlayer(playerId){
    const session = getCurrentSession();
    if(!session) return;
    const entry = sessionEntry(session, playerId);
    if(!entry) return;
    entry.cashOut = null;
    saveDB();
    render();
  }

  function finishNight(){
    const session = getCurrentSession();
    if(!session || session.entries.length === 0) return;
    const totals = computeSessionTotals(session);
    if(!totals.allCashedOut){
      if(!confirm("Not everyone has cashed out yet. Finish the night anyway?")) return;
    }
    session.finished = true;
    db.currentSessionId = null;
    saveDB();
    toast("Night logged to History");
    activeTab = "history";
    render();
  }

  function deleteSession(sessionId){
    if(!confirm("Delete this night? This can't be undone.")) return;
    db.sessions = db.sessions.filter(s => s.id !== sessionId);
    if(db.currentSessionId === sessionId) db.currentSessionId = null;
    saveDB();
    render();
  }

  function copySummary(){
    const session = getCurrentSession();
    if(!session) return;
    const totals = computeSessionTotals(session);
    let lines = [session.title, fmtDate(session.date), ""];
    session.entries.forEach(e => {
      const p = getPlayer(e.playerId);
      const net = entryNet(e);
      const status = (e.cashOut === null || e.cashOut === undefined) ? " (still playing)" : "";
      lines.push(`${p.name}: ${net >= 0 ? "+" : ""}${money(net)}${status}`);
    });
    lines.push("");
    lines.push(`Total buy-ins: ${money(totals.totalBuyIn)}  |  Total cash-outs: ${money(totals.totalCashOut)}`);
    const text = lines.join("\n");
    navigator.clipboard?.writeText(text).then(()=>toast("Summary copied")).catch(()=>{
      prompt("Copy this summary:", text);
    });
  }

  function exportData(){
    const blob = new Blob([JSON.stringify(db, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `mines-poker-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function importData(file){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.players || !parsed.sessions) throw new Error("Not a valid backup file");
        if(!confirm("This will replace all current data with the imported backup. Continue?")) return;
        db = parsed;
        db.currentSessionId = db.currentSessionId || null;
        saveDB();
        toast("Data imported");
        render();
      }catch(e){
        alert("Couldn't import that file: " + e.message);
      }
    };
    reader.readAsText(file);
  }

  // ---------- Rendering ----------

  function render(){
    document.querySelectorAll("nav.tabs button").forEach(b => {
      b.classList.toggle("active", b.dataset.tab === activeTab);
    });
    const main = document.getElementById("main");
    if(activeTab === "tonight") main.innerHTML = renderTonight();
    else if(activeTab === "history") main.innerHTML = renderHistory();
    else if(activeTab === "leaderboard") main.innerHTML = renderLeaderboard();
    else if(activeTab === "data") main.innerHTML = renderData();
    bindDynamicEvents();
    updateStatusLight();
  }

  function updateStatusLight(){
    const light = document.getElementById("statusLight");
    const session = getCurrentSession();
    const active = !!(session && session.entries.length > 0 && !session.finished);
    light.classList.toggle("live", active);
  }

  function bracketDecor(){
    return `<span class="bracket tr"></span><span class="bracket bl"></span>`;
  }

  function renderTonight(){
    const session = getCurrentSession();

    const totals = computeSessionTotals(session);

        balanceHtml = `<div class="balance-banner bad"><svg class="icon"><use href="#icon-warning"/></svg>Anomaly detected — off by ${money(Math.abs(diff))} (${diff > 0 ? "cash-outs short" : "cash-outs over"})</div>`;

    const playersHtml = session.entries.map(entry => {

            <span>Net <b class="net ${net >= 0 ? 'pos':'neg'}">${net >= 0 ? '+' : ''}${money(net)}</b></span>
          </div>
          ${!cashedOut ? `
            <div class="quickbuy">
              <button class="btn-chip btn-sm" data-action="buyin" data-player="${p.id}" data-amount="20"><svg class="icon"><use href="#icon-bolt"/></svg>+$20</button>
              <button class="btn-chip btn-sm" data-action="buyin" data-player="${p.id}" data-amount="50"><svg class="icon"><use href="#icon-bolt"/></svg>+$50</button>
              <button class="btn-chip btn-sm" data-action="buyin" data-player="${p.id}" data-amount="100"><svg class="icon"><use href="#icon-bolt"/></svg>+$100</button>
              <input type="number" class="btn-sm" style="width:84px" placeholder="custom" id="custom-${p.id}" min="0" step="0.01">
              <button class="btn-ghost btn-sm" data-action="buyin-custom" data-player="${p.id}"><svg class="icon"><use href="#icon-plus"/></svg>Add</button>
              ${entry.buyIns.length ? `<button class="btn-ghost btn-sm" data-action="undo-buyin" data-player="${p.id}"><svg class="icon"><use href="#icon-undo"/></svg>Undo</button>` : ""}

              <input type="number" placeholder="Final chips" id="cashout-${p.id}" min="0" step="0.01">
              <button class="btn-primary btn-sm" data-action="cashout" data-player="${p.id}"><svg class="icon"><use href="#icon-check"/></svg>Cash out</button>
              <button class="btn-danger btn-sm" data-action="remove-player" data-player="${p.id}"><svg class="icon"><use href="#icon-x"/></svg>Remove</button>
            </div>
          ` : `
            <div class="row">
              <button class="btn-ghost btn-sm" data-action="reopen" data-player="${p.id}"><svg class="icon"><use href="#icon-refresh"/></svg>Reopen</button>
            </div>
          `}
        </div>
      `;
    }).join("");

    return `
      <div class="card">
        ${bracketDecor()}
        <div class="eyebrow">Flight Log</div>
        <input type="text" class="titlebar-input" id="sessionTitle" value="${escapeHtml(session.title)}">
        <div class="hint" style="text-align:left; margin-top:2px;">${fmtDate(session.date)}</div>
      </div>

      ${balanceHtml}

      <div class="card">
        ${bracketDecor()}
        <div class="eyebrow">Crew</div>
        <h2>Players</h2>
        ${playersHtml}
        <div class="row" style="margin-top:4px;">
          <input type="text" id="newPlayerInput2" class="grow" placeholder="Add another player" list="rosterList">
          <button class="btn-primary" id="addPlayerBtn2"><svg class="icon"><use href="#icon-plus"/></svg>Add</button>
        </div>
        <datalist id="rosterList">
          ${db.players.map(p => `<option value="${escapeHtml(p.name)}">`).join("")}
        </datalist>
      </div>

      <div class="row wrap">
        <button class="btn-ghost" id="copySummaryBtn"><svg class="icon"><use href="#icon-copy"/></svg>Copy Summary</button>
        <button class="btn-primary" id="finishNightBtn"><svg class="icon"><use href="#icon-flag"/></svg>Finish Night</button>
      </div>
    `;
  }

  function renderHistory(){
    const finished = db.sessions.filter(s => s.finished).sort((a,b) => new Date(b.date) - new Date(a.date));
    if(finished.length === 0){
      return `<div class="card">${bracketDecor()}<div class="empty"><svg class="icon"><use href="#icon-radar"/></svg><br>No signal yet — no finished nights logged.<br>Wrap up tonight's game to see it here.</div></div>`;
    }
    return finished.map(session => {
      const totals = computeSessionTotals(session);
      const rows = session.entries.slice().sort((a,b) => entryNet(b) - entryNet(a)).map(e => {
        const p = getPlayer(e.playerId);
        const net = entryNet(e);
        return `<tr>
          <td>${escapeHtml(p ? p.name : "?")}</td>
          <td>${money(e.buyIns.reduce((a,b)=>a+b,0))}</td>
          <td>${e.cashOut !== null && e.cashOut !== undefined ? money(e.cashOut) : "—"}</td>
          <td class="net ${net>=0?'pos':'neg'}">${net>=0?'+':''}${money(net)}</td>
        </tr>`;
      }).join("");
      return `
        <div class="card session-summary">
          ${bracketDecor()}
          <div class="title-row">
            <span class="title">${escapeHtml(session.title)}</span>
            <span class="date">${fmtDate(session.date)}</span>
          </div>
          <table>
            <thead><tr><th>Player</th><th>Buy-in</th><th>Cash-out</th><th>Net</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="row between" style="margin-top:12px;">
            <span class="hint" style="margin:0;">Pot ${money(totals.totalBuyIn)}</span>
            <button class="btn-danger btn-sm" data-action="delete-session" data-session="${session.id}"><svg class="icon"><use href="#icon-trash"/></svg>Delete</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderLeaderboard(){
    const stats = computeLifetimeStats();
    if(stats.length === 0){
      return `<div class="card">${bracketDecor()}<div class="empty"><svg class="icon"><use href="#icon-medal"/></svg><br>No rankings yet.<br>Finish a game to start the leaderboard.</div></div>`;
    }
    const maxAbs = Math.max(...stats.map(s => Math.abs(s.net)), 1);
    const rows = stats.map((s, i) => `
      <div class="card" style="margin-bottom:10px; padding:14px;">
        ${bracketDecor()}
        <div class="row between" style="align-items:center;">
          <div class="row" style="align-items:center; gap:10px;">
            <span class="rank-badge ${i===0?'r1':i===1?'r2':i===2?'r3':''}">${i+1}</span>
            <span class="name" style="font-family:var(--font-display); font-weight:700; font-size:14.5px;">${escapeHtml(s.name)}</span>
          </div>
          <span class="net ${s.net>=0?'pos':'neg'}" style="font-size:16px;">${s.net>=0?'+':''}${money(s.net)}</span>
        </div>
        <div class="bar-track"><div class="bar-fill ${s.net>=0?'pos':'neg'}" style="width:${Math.min(100, Math.abs(s.net)/maxAbs*100)}%"></div></div>
        <div class="stat-line" style="margin-top:10px; margin-bottom:0;">
          <span>${s.nights} night${s.nights===1?'':'s'}</span>
          <span>Buy-in <b>${money(s.totalBuyIn)}</b></span>
          <span>Cash-out <b>${money(s.totalCashOut)}</b></span>
          <span>Best <b>${s.best>=0?'+':''}${money(s.best)}</b></span>
          <span>Worst <b>${s.worst>=0?'+':''}${money(s.worst)}</b></span>
        </div>
      </div>
    `).join("");
    return rows;
  }

  function renderData(){
    const finishedCount = db.sessions.filter(s => s.finished).length;
    return `
      <div class="card">
        ${bracketDecor()}
        <div class="eyebrow">Ship's Archive</div>
        <h2>Backup &amp; Restore</h2>
        <div class="hint" style="margin-bottom:14px; text-align:left;">
          Everything is stored only in this browser (localStorage). Export a backup regularly, especially before
          clearing browser data, switching browsers, or moving to a new device.
        </div>
        <div class="row wrap">
          <button class="btn-primary" id="exportBtn"><svg class="icon"><use href="#icon-download"/></svg>Export Backup</button>
          <button class="btn-ghost" id="importBtn"><svg class="icon"><use href="#icon-upload"/></svg>Import Backup</button>
        </div>
      </div>
      <div class="card">
        ${bracketDecor()}
        <div class="eyebrow">Diagnostics</div>
        <h2>Stats</h2>
        <div class="stat-line" style="margin:0;">
          <span>Players tracked <b>${db.players.length}</b></span>
          <span>Nights finished <b>${finishedCount}</b></span>

        ${bracketDecor()}
        <div class="eyebrow">Danger Zone</div>

        <button class="btn-danger" id="resetBtn"><svg class="icon"><use href="#icon-trash"/></svg>Erase all data</button>
      </div>
    `;

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function bindDynamicEvents(){
    const main = document.getElementById("main");

    const addBtn = document.getElementById("addPlayerBtn");
    const addInput = document.getElementById("newPlayerInput");
    if(addBtn && addInput){
      addBtn.addEventListener("click", () => { addPlayerToSession(addInput.value); addInput.value=""; });
      addInput.addEventListener("keydown", e => { if(e.key === "Enter"){ addPlayerToSession(addInput.value); addInput.value=""; } });
    }
    const addBtn2 = document.getElementById("addPlayerBtn2");
    const addInput2 = document.getElementById("newPlayerInput2");
    if(addBtn2 && addInput2){
      addBtn2.addEventListener("click", () => { addPlayerToSession(addInput2.value); addInput2.value=""; });
      addInput2.addEventListener("keydown", e => { if(e.key === "Enter"){ addPlayerToSession(addInput2.value); addInput2.value=""; } });
    }

    const titleInput = document.getElementById("sessionTitle");
    if(titleInput){
      titleInput.addEventListener("change", () => {
        const session = getCurrentSession();
        if(session){ session.title = titleInput.value.trim() || session.title; saveDB(); }
      });
    }

    main.querySelectorAll("[data-action=buyin]").forEach(btn => {
      btn.addEventListener("click", () => addBuyIn(btn.dataset.player, parseFloat(btn.dataset.amount)));
    });
    main.querySelectorAll("[data-action=buyin-custom]").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById("custom-" + btn.dataset.player);
        const amount = parseFloat(input.value);
        if(!isNaN(amount) && amount > 0){ addBuyIn(btn.dataset.player, amount); }
      });
    });
    main.querySelectorAll("[data-action=undo-buyin]").forEach(btn => {
      btn.addEventListener("click", () => undoLastBuyIn(btn.dataset.player));
    });
    main.querySelectorAll("[data-action=cashout]").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById("cashout-" + btn.dataset.player);
        const amount = parseFloat(input.value);
        if(!isNaN(amount) && amount >= 0){ setCashOut(btn.dataset.player, amount); }
        else{ alert("Enter the final chip count before cashing out."); }
      });
    });
    main.querySelectorAll("[data-action=reopen]").forEach(btn => {
      btn.addEventListener("click", () => reopenPlayer(btn.dataset.player));
    });
    main.querySelectorAll("[data-action=remove-player]").forEach(btn => {
      btn.addEventListener("click", () => {
        if(confirm("Remove this player from tonight?")) removePlayerFromSession(btn.dataset.player);
      });
    });
    main.querySelectorAll("[data-action=delete-session]").forEach(btn => {
      btn.addEventListener("click", () => deleteSession(btn.dataset.session));
    });

    const copyBtn = document.getElementById("copySummaryBtn");
    if(copyBtn) copyBtn.addEventListener("click", copySummary);
    const finishBtn = document.getElementById("finishNightBtn");
    if(finishBtn) finishBtn.addEventListener("click", finishNight);

    const exportBtn = document.getElementById("exportBtn");
    if(exportBtn) exportBtn.addEventListener("click", exportData);
    const importBtn = document.getElementById("importBtn");
    if(importBtn) importBtn.addEventListener("click", () => document.getElementById("importFile").click());
    const resetBtn = document.getElementById("resetBtn");
    if(resetBtn) resetBtn.addEventListener("click", () => {
      if(confirm("This will permanently erase all players and history. Are you sure?")){
        db = { players: [], sessions: [], currentSessionId: null };
        saveDB();
        toast("All data erased");
        render();
      }
    });
  }

  document.getElementById("importFile").addEventListener("change", e => {
    const file = e.target.files[0];
    if(file) importData(file);
    e.target.value = "";
  });

  document.querySelectorAll("nav.tabs button").forEach(btn => {
    btn.addEventListener("click", () => { activeTab = btn.dataset.tab; render(); });
  });

  // ---------- Starfield ----------
  function initStarfield(){
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let stars = [];
    let w = 0, h = 0;

    function resize(){
      w = window.innerWidth; h = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round((w * h) / 8500);
      stars = Array.from({length: count}, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: 0.0015 + Math.random() * 0.003,
        baseAlpha: 0.35 + Math.random() * 0.65
      }));
    }

    function drawNebula(){
      const g1 = ctx.createRadialGradient(w*0.14, h*0.08, 0, w*0.14, h*0.08, w*0.55);
      g1.addColorStop(0, "rgba(77,238,234,0.06)");
      g1.addColorStop(1, "rgba(77,238,234,0)");
      ctx.fillStyle = g1; ctx.fillRect(0, 0, w, h);
      const g2 = ctx.createRadialGradient(w*0.88, h*0.28, 0, w*0.88, h*0.28, w*0.5);
      g2.addColorStop(0, "rgba(166,133,255,0.07)");
      g2.addColorStop(1, "rgba(166,133,255,0)");
      ctx.fillStyle = g2; ctx.fillRect(0, 0, w, h);
    }

    function paint(t){
      ctx.clearRect(0, 0, w, h);
      drawNebula();
      stars.forEach(s => {
        const a = reduced ? s.baseAlpha : s.baseAlpha * (0.55 + 0.45 * Math.sin(t * s.speed + s.phase));
        ctx.beginPath();
        ctx.fillStyle = `rgba(233,242,255,${a})`;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      if(!reduced) requestAnimationFrame(paint);
    }

    window.addEventListener("resize", resize);
    resize();
    if(reduced){ paint(0); } else { requestAnimationFrame(paint); }
  }

  initStarfield();
  render();
})();
</script>
</body>
</html>
