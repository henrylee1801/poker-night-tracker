  function renderHistory(){
    const allFinished = db.sessions.filter(s => s.finished);
    if(allFinished.length === 0){
      return `<div class="card">${bracketDecor()}<div class="empty"><svg class="icon"><use href="#icon-radar"/></svg><br>No signal yet — no finished nights logged.<br>Wrap up tonight's game to see it here.</div></div>`;
    }

    const filterHtml = `
      <div class="card history-filter">
        ${bracketDecor()}
        <div class="eyebrow">Date Range</div>
        <div class="date-range-row">
          <span class="date-range-label">From</span>
          ${renderDateFields("historyFrom", partsFromDateStr(historyDateFrom), "boxed")}
          <span class="date-range-label">To</span>
          ${renderDateFields("historyTo", partsFromDateStr(historyDateTo), "boxed")}
          ${(historyDateFrom || historyDateTo) ? `<button type="button" class="btn-ghost btn-sm" data-action="clear-history-filter"><svg class="icon"><use href="#icon-x"/></svg>Clear</button>` : ""}
        </div>
      </div>
    `;

    let finished = allFinished;
    if(historyDateFrom){
      const fromTime = new Date(historyDateFrom + "T00:00:00").getTime();
      finished = finished.filter(s => new Date(s.date).getTime() >= fromTime);
    }
    if(historyDateTo){
      const toTime = new Date(historyDateTo + "T23:59:59").getTime();
      finished = finished.filter(s => new Date(s.date).getTime() <= toTime);
    }
    finished = finished.slice().sort((a,b) => new Date(b.date) - new Date(a.date));

    if(finished.length === 0){
      return `${filterHtml}<div class="card">${bracketDecor()}<div class="empty"><svg class="icon"><use href="#icon-orbit"/></svg><br>No missions in this date range.</div></div>`;
    }

    const allCollapsed = finished.every(s => !expandedSessions.has(s.id));
    const toolbarHtml = finished.length > 1 ? `
      <div class="history-toolbar">
        <button type="button" class="btn-ghost btn-sm" data-action="toggle-all-sessions" data-sessions="${finished.map(s=>s.id).join(',')}">
          <svg class="icon"><use href="#icon-chevron"/></svg>${allCollapsed ? "Expand All" : "Collapse All"}
        </button>
      </div>
    ` : "";

    const cardsHtml = finished.map(session => {
      const totals = computeSessionTotals(session);
      const editing = editingSessionId === session.id;

      if(editing){
        const editRows = session.entries.map(e => {
          const p = getPlayer(e.playerId);
          const buyInTotal = e.buyIns.reduce((a,b)=>a+b,0);
          const cashOutVal = (e.cashOut === null || e.cashOut === undefined) ? "" : e.cashOut;
          return `<tr>
            <td>${escapeHtml(p ? p.name : "?")}</td>
            <td><input type="number" class="edit-buyin" data-session="${session.id}" data-entry="${e.playerId}" min="0" step="0.01" value="${buyInTotal}"></td>
            <td><input type="number" class="edit-cashout" data-session="${session.id}" data-entry="${e.playerId}" min="0" step="0.01" value="${cashOutVal}" placeholder="still playing"></td>
            <td class="edit-remove"><button type="button" class="btn-danger btn-sm" data-action="remove-entry-edit" data-session="${session.id}" data-entry="${e.playerId}"><svg class="icon"><use href="#icon-x"/></svg></button></td>
          </tr>`;
        }).join("");
        return `
          <div class="card session-summary">
            ${bracketDecor()}
            <div class="title-row">
              <input type="text" class="titlebar-input edit-title" id="editTitle-${session.id}" value="${escapeHtml(session.title)}">
              ${renderDateFields("editDate-" + session.id, dateParts(session.date), "boxed")}
            </div>
            <table>
              <thead><tr><th>Player</th><th>Buy-in</th><th>Cash-out</th><th></th></tr></thead>
              <tbody>${editRows}</tbody>
            </table>
            <div class="row between" style="margin-top:12px;">
              <button class="btn-ghost btn-sm" data-action="cancel-session-edit" data-session="${session.id}"><svg class="icon"><use href="#icon-x"/></svg>Cancel</button>
              <button class="btn-primary btn-sm" data-action="save-session-edit" data-session="${session.id}"><svg class="icon"><use href="#icon-check"/></svg>Save Changes</button>
            </div>
          </div>
        `;
      }

      const collapsed = !expandedSessions.has(session.id);
      const chevron = `<svg class="icon collapse-chevron ${collapsed ? 'collapsed' : ''}"><use href="#icon-chevron"/></svg>`;

      if(collapsed){
        return `
          <div class="card session-summary is-collapsed">
            ${bracketDecor()}
            <div class="title-row session-toggle" data-action="toggle-session-collapse" data-session="${session.id}" style="margin-bottom:0;">
              <span class="title">${chevron}${escapeHtml(session.title)}</span>
              <span class="date">${fmtDate(session.date)}</span>
            </div>
            <div class="hint" style="text-align:left; margin-top:6px;">${session.entries.length} player${session.entries.length===1?'':'s'} · Pot ${money(totals.totalBuyIn)}</div>
          </div>
        `;
      }

      const rows = session.entries.slice().sort((a,b) => entryNet(b) - entryNet(a)).map(e => {
        const p = getPlayer(e.playerId);
        const net = entryNet(e);
        return `<tr>
          <td>${escapeHtml(p ? p.name : "?")}</td>
          <td>${money(e.buyIns.reduce((a,b)=>a+b,0))}</td>
          <td>${e.cashOut !== null && e.cashOut !== undefined ? money(e.cashOut) : "—"}</td>
          <td class="net ${net>=0?'pos':'neg'}">${net>=0?'+':''}${money(net)}</td>
        </tr>`;
      }).join("");
      return `
        <div class="card session-summary">
          ${bracketDecor()}
          <div class="title-row session-toggle" data-action="toggle-session-collapse" data-session="${session.id}">
            <span class="title">${chevron}${escapeHtml(session.title)}</span>
            <span class="date">${fmtDate(session.date)}</span>
          </div>
          <table>
            <thead><tr><th>Player</th><th>Buy-in</th><th>Cash-out</th><th>Net</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          ${session.anomalyNote ? `
            <div class="anomaly-note-ro">
              <div class="anomaly-note-label">Anomaly note</div>
              <p>${escapeHtml(session.anomalyNote)}</p>
            </div>
          ` : ""}
          <div class="row between" style="margin-top:12px;">
            <span class="hint" style="margin:0;">Pot ${money(totals.totalBuyIn)}</span>
            <div class="row" style="gap:6px;">
              <button class="btn-ghost btn-sm" data-action="edit-session" data-session="${session.id}"><svg class="icon"><use href="#icon-edit"/></svg>Edit</button>
              <button class="btn-danger btn-sm" data-action="delete-session" data-session="${session.id}"><svg class="icon"><use href="#icon-trash"/></svg>Delete</button>
            </div>
          </div>
        </div>
      `;
    }).join("");

    return filterHtml + toolbarHtml + cardsHtml;
  }

  function renderLeaderboard(){
    const stats = computeLifetimeStats();
    if(stats.length === 0){
      return `<div class="card">${bracketDecor()}<div class="empty"><svg class="icon"><use href="#icon-medal"/></svg><br>No rankings yet.<br>Finish a game to start the leaderboard.</div></div>`;
    }

    const filterHtml = `
      <div class="row" style="margin-bottom:10px;">
        <input type="text" id="leaderboardSearchInput" placeholder="Search player&hellip;" autocomplete="off" value="${escapeHtml(leaderboardSearch)}">
      </div>
      <div class="leaderboard-sort">
        <button type="button" class="filter-btn ${leaderboardSort==='net'?'active':''}" data-sort="net">Sort: Net</button>
        <button type="button" class="filter-btn ${leaderboardSort==='missions'?'active':''}" data-sort="missions">Sort: Missions</button>
      </div>
    `;

    return `${filterHtml}<div id="leaderboardResults">${renderLeaderboardResultsHtml(stats)}</div>`;
  }

  function renderLeaderboardResultsHtml(stats){
    const query = leaderboardSearch.trim().toLowerCase();
    const filtered = query ? stats.filter(s => s.name.toLowerCase().includes(query)) : stats;

    if(filtered.length === 0){
      return `<div class="card">${bracketDecor()}<div class="empty"><svg class="icon"><use href="#icon-medal"/></svg><br>No players match &ldquo;${escapeHtml(leaderboardSearch.trim())}&rdquo;.</div></div>`;
    }

    const sortedStats = filtered.slice();
    if(leaderboardSort === "missions") sortedStats.sort((a,b) => b.nights - a.nights || b.net - a.net);
    else sortedStats.sort((a,b) => b.net - a.net);

    if(leaderboardSort === "missions") return renderMissionsLeaderboardHtml(sortedStats);
    return renderNetLeaderboardHtml(sortedStats);
  }

  function renderMissionsLeaderboardHtml(sortedStats){
    const rows = sortedStats.map((s, i) => `
      <div class="missions-lb-row">
        <span class="rank-badge ${i===0?'r1':i===1?'r2':i===2?'r3':''}">${i+1}</span>
        <span class="missions-lb-name">${escapeHtml(s.name)}</span>
        <span class="missions-lb-count">${s.nights}<span class="missions-lb-unit">${s.nights===1?'night':'nights'}</span></span>
      </div>
    `).join("");
    return `
      <div class="card">
        ${bracketDecor()}
        <div class="eyebrow">Attendance Log</div>
        <h2>Most Nights Played</h2>
        <div class="missions-lb-list">${rows}</div>
      </div>
    `;
  }

  function renderNetLeaderboardHtml(sortedStats){
    return `<div class="leaderboard-grid">${sortedStats.map((s, i) => {
      const expanded = expandedLeaderboardPlayers.has(s.playerId);

      const detailsHtml = expanded ? `
        <div class="lb-details">
          <div class="lb-detail-row"><span class="lb-range-label">Best night</span><b class="net ${s.best>=0?'pos':'neg'}">${s.best>=0?'+':''}${money(s.best)}</b><span class="lb-detail-date">${fmtDate(s.bestDate)}</span></div>
          <div class="lb-detail-row"><span class="lb-range-label">Worst night</span><b class="net ${s.worst>=0?'pos':'neg'}">${s.worst>=0?'+':''}${money(s.worst)}</b><span class="lb-detail-date">${fmtDate(s.worstDate)}</span></div>
        </div>
      ` : "";

      return `
        <div class="card leaderboard-card">
          ${bracketDecor()}
          <div class="lb-top">
            <div class="lb-who">
              <span class="rank-badge ${i===0?'r1':i===1?'r2':i===2?'r3':''}">${i+1}</span>
              <div class="lb-name">${escapeHtml(s.name)}</div>
            </div>
            <span class="lb-net-pill ${s.net>=0?'pos':'neg'}">${s.net>=0?'+':''}${money(s.net)}</span>
          </div>
          <div class="lb-chips">
            <span class="lb-chip"><svg class="icon"><use href="#icon-radar"/></svg>${s.nights} ${s.nights===1?'night':'nights'}</span>
            <span class="lb-chip">Buy-in <b>${money(s.totalBuyIn)}</b></span>
            <span class="lb-chip">Cash-out <b>${money(s.totalCashOut)}</b></span>
            ${streakChipHtml(s)}
          </div>
          <button type="button" class="lb-expand-btn" data-action="toggle-leaderboard-player" data-player="${s.playerId}">
            <svg class="icon collapse-chevron ${expanded?'':'collapsed'}"><use href="#icon-chevron"/></svg>
            ${expanded ? 'Hide info' : 'More info'}
          </button>
          ${detailsHtml}
        </div>
      `;
    }).join("")}</div>`;
  }

  function refreshLeaderboardResults(){
    const container = document.getElementById("leaderboardResults");
    if(!container) return;
    container.innerHTML = renderLeaderboardResultsHtml(computeLifetimeStats());
    bindLeaderboardResultEvents(container);
  }

  function bindLeaderboardResultEvents(root){
    root.querySelectorAll("[data-action=toggle-leaderboard-player]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.player;
        if(expandedLeaderboardPlayers.has(id)) expandedLeaderboardPlayers.delete(id);
        else expandedLeaderboardPlayers.add(id);
        refreshLeaderboardResults();
      });
    });
  }

  function renderData(){
    const finishedCount = db.sessions.filter(s => s.finished).length;
    const activePlayers = db.players.filter(p => !p.archived).sort((a,b) => a.name.localeCompare(b.name));
    const rosterRows = activePlayers.length === 0 ? `<div class="hint" style="text-align:left; margin:0;">No players yet.</div>` :
      `<div class="roster-grid">` + activePlayers.map(p => {
        if(editingRosterPlayerId === p.id){
          return `
            <div class="roster-row editing">
              <input type="text" class="roster-edit-input" id="rosterEdit-${p.id}" value="${escapeHtml(p.name)}">
              <button type="button" class="suggest-icon-btn" data-action="save-roster-edit" data-player="${p.id}" aria-label="Save"><svg class="icon"><use href="#icon-check"/></svg></button>
              <button type="button" class="suggest-icon-btn" data-action="cancel-roster-edit" aria-label="Cancel"><svg class="icon"><use href="#icon-x"/></svg></button>
            </div>
          `;
        }
        return `
          <div class="roster-row">
            <span class="roster-name-text">${escapeHtml(p.name)}</span>
            <button type="button" class="suggest-icon-btn" data-action="edit-roster-player" data-player="${p.id}" aria-label="Edit"><svg class="icon"><use href="#icon-edit"/></svg></button>
            <button type="button" class="suggest-icon-btn danger" data-action="archive-player" data-player="${p.id}" aria-label="Remove"><svg class="icon"><use href="#icon-trash"/></svg></button>
          </div>
        `;
      }).join("") + `</div>`;
    return `
      <div class="card">
        ${bracketDecor()}
        <div class="eyebrow">Ship's Archive</div>
        <h2>Backup &amp; Restore</h2>
        <div class="row wrap">
          <button class="btn-primary" id="exportBtn"><svg class="icon"><use href="#icon-download"/></svg>Export Backup</button>
          <button class="btn-ghost" id="importBtn"><svg class="icon"><use href="#icon-upload"/></svg>Import Backup</button>
        </div>
      </div>
      <div class="card">
        ${bracketDecor()}
        <div class="eyebrow">Crew Roster &middot; A&ndash;Z</div>
        <h2>Manage Players</h2>
        <div class="row" style="margin-bottom:14px;">
          <input type="text" id="newRosterPlayerInput" class="grow" placeholder="Add a player" autocomplete="off">
          <button class="btn-primary btn-sm" id="addRosterPlayerBtn"><svg class="icon"><use href="#icon-plus"/></svg>Add</button>
        </div>
        ${rosterRows}
      </div>
      <div class="card">
        ${bracketDecor()}
        <div class="eyebrow">Diagnostics</div>
        <h2>Stats</h2>
        <div class="stat-line" style="margin:0;">
          <span>Players tracked <b>${activePlayers.length}</b></span>
          <span>Nights finished <b>${finishedCount}</b></span>
        </div>
      </div>
      <div class="card">
        ${bracketDecor()}
        <div class="eyebrow">Danger Zone</div>
        <h2>Self-Destruct</h2>
        <button class="btn-danger" id="resetBtn"><svg class="icon"><use href="#icon-trash"/></svg>Erase all data</button>
      </div>
    `;
  }

  function streakChipHtml(s){
    if(s.streak < 2 || !s.streakType) return "";
    const hot = s.streakType === "win";
    return `<span class="lb-chip ${hot?'hot':'cold'}"><svg class="icon"><use href="#icon-${hot?'bolt':'warning'}"/></svg>${s.streak}-night ${hot?'hot':'cold'} streak</span>`;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function bindDynamicEvents(){
    const main = document.getElementById("main");

    const startNewGameBtn = document.getElementById("startNewGameBtn");
    if(startNewGameBtn) startNewGameBtn.addEventListener("click", () => { ensureCurrentSession(); saveDB(); render(); });

    const startNewGameDashboardBtn = document.getElementById("startNewGameDashboardBtn");
    if(startNewGameDashboardBtn) startNewGameDashboardBtn.addEventListener("click", () => { ensureCurrentSession(); saveDB(); activeTab = "tonight"; render(); });

    const resumeMissionBtn = document.getElementById("resumeMissionBtn");
    if(resumeMissionBtn) resumeMissionBtn.addEventListener("click", () => { activeTab = "tonight"; render(); });

    const discardMissionBtn = document.getElementById("discardMissionBtn");
    if(discardMissionBtn) discardMissionBtn.addEventListener("click", () => {
      const current = getCurrentSession();
      if(current) deleteSession(current.id);
    });

    const viewLeaderboardBtn = document.getElementById("viewLeaderboardBtn");
    if(viewLeaderboardBtn) viewLeaderboardBtn.addEventListener("click", () => { activeTab = "leaderboard"; render(); });

    main.querySelectorAll("[data-action=toggle-dashboard-player]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.player;
        if(expandedDashboardPlayers.has(id)) expandedDashboardPlayers.delete(id);
        else expandedDashboardPlayers.add(id);
        render();
      });
    });
    bindLeaderboardResultEvents(main);

    const leaderboardSearchInput = document.getElementById("leaderboardSearchInput");
    if(leaderboardSearchInput){
      leaderboardSearchInput.addEventListener("input", () => {
        leaderboardSearch = leaderboardSearchInput.value;
        refreshLeaderboardResults();
      });
    }

    const addBtn2 = document.getElementById("addPlayerBtn2");
    const addInput2 = document.getElementById("newPlayerInput2");
    if(addBtn2 && addInput2){
      addBtn2.addEventListener("click", () => { addPlayerToSession(addInput2.value); addInput2.value=""; });
      addInput2.addEventListener("keydown", e => {
        if(e.key === "Enter"){ addPlayerToSession(addInput2.value); addInput2.value=""; }
        else if(e.key === "Escape"){ closePlayerSuggest(); }
      });
      addInput2.addEventListener("focus", () => openPlayerSuggest(addInput2));
      addInput2.addEventListener("input", () => openPlayerSuggest(addInput2));
    }

    const titleInput = document.getElementById("sessionTitle");
    if(titleInput){
      titleInput.addEventListener("change", () => {
        const session = getCurrentSession();
        if(session){ session.title = titleInput.value.trim() || session.title; saveDB(); }
      });
    }

    bindDateFieldsChange("sessionDate", val => {
      const session = getCurrentSession();
      if(session){ session.date = dateInputValueToIso(val); saveDB(); }
    });

    const anomalyNoteInput = document.getElementById("anomalyNote");
    if(anomalyNoteInput){
      anomalyNoteInput.addEventListener("change", () => {
        const session = getCurrentSession();
        if(session){ session.anomalyNote = anomalyNoteInput.value.trim(); saveDB(); }
      });
    }

    main.querySelectorAll("[data-action=toggle-buyin-menu]").forEach(btn => {
      btn.addEventListener("click", () => {
        const playerId = btn.dataset.player;
        if(buyinMenuPlayer === playerId) closeBuyInMenu();
        else openBuyInMenuFor(playerId, btn);
      });
    });
    main.querySelectorAll("[data-action=toggle-cashout-menu]").forEach(btn => {
      btn.addEventListener("click", () => {
        const playerId = btn.dataset.player;
        if(cashoutMenuPlayer === playerId) closeCashOutMenu();
        else openCashOutMenuFor(playerId, btn);
      });
    });
    main.querySelectorAll("[data-action=reopen]").forEach(btn => {
      btn.addEventListener("click", () => reopenPlayer(btn.dataset.player));
    });
    main.querySelectorAll("[data-action=remove-player]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const ok = await showConfirm("Remove this player from tonight?", { danger:true, title:"Remove Player", okText:"Remove" });
        if(ok) removePlayerFromSession(btn.dataset.player);
      });
    });
    main.querySelectorAll("[data-action=delete-session]").forEach(btn => {
      btn.addEventListener("click", () => deleteSession(btn.dataset.session));
    });
    main.querySelectorAll("[data-action=edit-session]").forEach(btn => {
      btn.addEventListener("click", () => { editingSessionId = btn.dataset.session; render(); });
    });
    main.querySelectorAll("[data-action=cancel-session-edit]").forEach(btn => {
      btn.addEventListener("click", () => { editingSessionId = null; render(); });
    });
    main.querySelectorAll("[data-action=save-session-edit]").forEach(btn => {
      btn.addEventListener("click", () => saveSessionEdit(btn.dataset.session));
    });
    main.querySelectorAll("[data-action=remove-entry-edit]").forEach(btn => {
      btn.addEventListener("click", () => removeEntryFromHistorySession(btn.dataset.session, btn.dataset.entry));
    });

    bindDateFieldsChange("historyFrom", val => { historyDateFrom = val; render(); });
    bindDateFieldsChange("historyTo", val => { historyDateTo = val; render(); });
    main.querySelectorAll("[data-action=clear-history-filter]").forEach(btn => {
      btn.addEventListener("click", () => { historyDateFrom = ""; historyDateTo = ""; render(); });
    });
    main.querySelectorAll("[data-action=toggle-session-collapse]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.session;
        if(expandedSessions.has(id)) expandedSessions.delete(id);
        else expandedSessions.add(id);
        render();
      });
    });
    main.querySelectorAll("[data-action=toggle-all-sessions]").forEach(btn => {
      btn.addEventListener("click", () => {
        const ids = btn.dataset.sessions.split(",").filter(Boolean);
        const allCollapsed = ids.every(id => !expandedSessions.has(id));
        ids.forEach(id => { if(allCollapsed) expandedSessions.add(id); else expandedSessions.delete(id); });
        render();
      });
    });

    main.querySelectorAll(".leaderboard-sort .filter-btn").forEach(btn => {
      btn.addEventListener("click", () => { leaderboardSort = btn.dataset.sort; render(); });
    });

    const copyBtn = document.getElementById("copySummaryBtn");
    if(copyBtn) copyBtn.addEventListener("click", copySummary);
    const finishBtn = document.getElementById("finishNightBtn");
    if(finishBtn) finishBtn.addEventListener("click", finishNight);

    main.querySelectorAll("[data-action=archive-player]").forEach(btn => {
      btn.addEventListener("click", () => archivePlayer(btn.dataset.player));
    });
    main.querySelectorAll("[data-action=edit-roster-player]").forEach(btn => {
      btn.addEventListener("click", () => { editingRosterPlayerId = btn.dataset.player; render(); });
    });
    main.querySelectorAll("[data-action=cancel-roster-edit]").forEach(btn => {
      btn.addEventListener("click", () => { editingRosterPlayerId = null; render(); });
    });
    main.querySelectorAll("[data-action=save-roster-edit]").forEach(btn => {
      btn.addEventListener("click", () => {
        const inp = document.getElementById("rosterEdit-" + btn.dataset.player);
        if(inp) renamePlayer(btn.dataset.player, inp.value);
        editingRosterPlayerId = null;
        render();
      });
    });
    const rosterEditInput = main.querySelector(".roster-edit-input");
    if(rosterEditInput){
      rosterEditInput.focus();
      rosterEditInput.select();
      rosterEditInput.addEventListener("keydown", e => {
        if(e.key === "Enter"){
          e.preventDefault();
          renamePlayer(editingRosterPlayerId, rosterEditInput.value);
          editingRosterPlayerId = null;
          render();
        }else if(e.key === "Escape"){
          e.preventDefault();
          editingRosterPlayerId = null;
          render();
        }
      });
    }
    const addRosterBtn = document.getElementById("addRosterPlayerBtn");
    const addRosterInput = document.getElementById("newRosterPlayerInput");
    if(addRosterBtn && addRosterInput){
      addRosterBtn.addEventListener("click", () => { addPlayerToRoster(addRosterInput.value); addRosterInput.value=""; });
      addRosterInput.addEventListener("keydown", e => {
        if(e.key === "Enter"){ addPlayerToRoster(addRosterInput.value); addRosterInput.value=""; }
      });
    }

    const exportBtn = document.getElementById("exportBtn");
    if(exportBtn) exportBtn.addEventListener("click", exportData);
    const importBtn = document.getElementById("importBtn");
    if(importBtn) importBtn.addEventListener("click", () => document.getElementById("importFile").click());
    const resetBtn = document.getElementById("resetBtn");
    if(resetBtn) resetBtn.addEventListener("click", async () => {
      const ok = await showConfirm("This will permanently erase all players and history. Are you sure?", { danger:true, title:"Self-Destruct", okText:"Erase Everything" });
      if(ok){
        db = { players: [], sessions: [], currentSessionId: null };
        saveDB();
        toast("All data erased");
        render();
      }
    });
  }

  document.getElementById("importFile").addEventListener("change", e => {
    const file = e.target.files[0];
    if(file) importData(file);
    e.target.value = "";
  });

  document.querySelectorAll("nav.tabs button").forEach(btn => {
    btn.addEventListener("click", () => { activeTab = btn.dataset.tab; render(); });
  });

  document.addEventListener("click", e => {
    if(!buyinMenuPlayer && !cashoutMenuPlayer && !playerSuggestInputEl) return;
    if(e.target.closest("[data-action=toggle-buyin-menu],[data-action=toggle-cashout-menu]")) return;
    if(playerSuggestInputEl && e.target === playerSuggestInputEl) return;
    const buyinMenu = document.getElementById("buyinMenu");
    if(buyinMenu && buyinMenu.contains(e.target)) return;
    const cashoutMenu = document.getElementById("cashoutMenu");
    if(cashoutMenu && cashoutMenu.contains(e.target)) return;
    const suggestBox = document.getElementById("playerSuggest");
    if(suggestBox && suggestBox.contains(e.target)) return;
    closeAllPopovers();
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && (buyinMenuPlayer || cashoutMenuPlayer || playerSuggestInputEl)) closeAllPopovers();
  });
  function repositionPlayerSuggest(){
    if(!playerSuggestInputEl) return;
    const box = document.getElementById("playerSuggest");
    if(box) positionPopover(box, playerSuggestInputEl);
  }
  // Resize/scroll can fire just from the on-screen keyboard opening (e.g.
  // right when the suggest box is opened by focusing the field) — closing
  // it here would race with opening it, so buyin/cashout still close on
  // these, but the suggest box just repositions to follow the keyboard.
  window.addEventListener("resize", () => {
    if(buyinMenuPlayer) closeBuyInMenu();
    if(cashoutMenuPlayer) closeCashOutMenu();
    repositionPlayerSuggest();
  });
  window.addEventListener("scroll", () => {
    if(buyinMenuPlayer) closeBuyInMenu();
    if(cashoutMenuPlayer) closeCashOutMenu();
    repositionPlayerSuggest();
  }, true);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", repositionPlayerSuggest);
    window.visualViewport.addEventListener("scroll", repositionPlayerSuggest);
  }

  document.getElementById("modalOkBtn").addEventListener("click", () => closeModal(true));
  document.getElementById("modalCancelBtn").addEventListener("click", () => closeModal(false));
  document.getElementById("modalOverlay").addEventListener("click", e => {
    if(e.target.id === "modalOverlay") closeModal(false);
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && document.getElementById("modalOverlay").classList.contains("open")) closeModal(false);
  });

  // ---------- Starfield ----------
  function initStarfield(){
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let stars = [];
    let shootingStars = [];
    let meteors = [];
    let w = 0, h = 0;
    let nextShootingStarAt = 0, nextMeteorAt = 0;
    const DRIFT_ANGLE = 200 * Math.PI / 180;
    const DRIFT_X = Math.cos(DRIFT_ANGLE), DRIFT_Y = Math.sin(DRIFT_ANGLE);

    function scheduleNext(min, max){ return performance.now() + min + Math.random() * (max - min); }

    function spawnShootingStar(){
      const dir = Math.random() < 0.5 ? 1 : -1;
      const angle = (16 + Math.random() * 16) * Math.PI / 180;
      const speed = 9 + Math.random() * 7;
      shootingStars.push({
        x: dir === 1 ? -60 - Math.random() * 120 : w + 60 + Math.random() * 120,
        y: Math.random() * h * 0.5,
        vx: dir * speed * Math.cos(angle),
        vy: speed * Math.sin(angle),
        len: 90 + Math.random() * 70,
        life: 1,
        decay: 0.007 + Math.random() * 0.005
      });
    }

    function spawnMeteor(){
      const dir = Math.random() < 0.5 ? 1 : -1;
      const angle = (32 + Math.random() * 16) * Math.PI / 180;
      const speed = 4.5 + Math.random() * 3;
      meteors.push({
        x: dir === 1 ? -80 : w + 80,
        y: -50 - Math.random() * 60,
        vx: dir * speed * Math.cos(angle),
        vy: speed * Math.sin(angle),
        r: 2 + Math.random() * 1.6,
        len: 130 + Math.random() * 90,
        life: 1,
        decay: 0.0035 + Math.random() * 0.002,
        color: Math.random() < 0.5 ? "233,196,106" : "166,133,255"
      });
    }

    function resize(){
      w = window.innerWidth; h = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round((w * h) / 8500);
      stars = Array.from({length: count}, () => {
        const r = Math.random() * 1.3 + 0.3;
        const drift = 0.05 + r * 0.09;
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          r,
          dx: DRIFT_X * drift,
          dy: DRIFT_Y * drift,
          phase: Math.random() * Math.PI * 2,
          speed: 0.0015 + Math.random() * 0.003,
          baseAlpha: 0.35 + Math.random() * 0.65
        };
      });
    }

    function drawNebula(){
      const g1 = ctx.createRadialGradient(w*0.14, h*0.08, 0, w*0.14, h*0.08, w*0.55);
      g1.addColorStop(0, "rgba(77,238,234,0.06)");
      g1.addColorStop(1, "rgba(77,238,234,0)");
      ctx.fillStyle = g1; ctx.fillRect(0, 0, w, h);
      const g2 = ctx.createRadialGradient(w*0.88, h*0.28, 0, w*0.88, h*0.28, w*0.5);
      g2.addColorStop(0, "rgba(166,133,255,0.07)");
      g2.addColorStop(1, "rgba(166,133,255,0)");
      ctx.fillStyle = g2; ctx.fillRect(0, 0, w, h);
    }

    function drawShootingStars(){
      shootingStars.forEach(s => {
        s.x += s.vx; s.y += s.vy; s.life -= s.decay;
        const mag = Math.hypot(s.vx, s.vy) || 1;
        const tailX = s.x - (s.vx / mag) * s.len;
        const tailY = s.y - (s.vy / mag) * s.len;
        const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
        grad.addColorStop(0, `rgba(233,242,255,${s.life})`);
        grad.addColorStop(1, "rgba(233,242,255,0)");
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tailX, tailY); ctx.stroke();
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${Math.max(s.life, 0)})`;
        ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      });
      shootingStars = shootingStars.filter(s => s.life > 0 && s.x > -300 && s.x < w + 300 && s.y < h + 300);
    }

    function drawMeteors(){
      meteors.forEach(m => {
        m.x += m.vx; m.y += m.vy; m.life -= m.decay;
        const mag = Math.hypot(m.vx, m.vy) || 1;
        const tailX = m.x - (m.vx / mag) * m.len;
        const tailY = m.y - (m.vy / mag) * m.len;
        const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
        grad.addColorStop(0, `rgba(${m.color},${m.life})`);
        grad.addColorStop(1, `rgba(${m.color},0)`);
        ctx.strokeStyle = grad;
        ctx.lineWidth = m.r;
        ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tailX, tailY); ctx.stroke();
        ctx.save();
        ctx.shadowColor = `rgba(${m.color},1)`;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${Math.max(m.life, 0)})`;
        ctx.arc(m.x, m.y, m.r * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      meteors = meteors.filter(m => m.life > 0 && m.y < h + 300);
    }

    function paint(t){
      ctx.clearRect(0, 0, w, h);
      drawNebula();
      stars.forEach(s => {
        if(!reduced){
          s.x += s.dx; s.y += s.dy;
          if(s.x < -5) s.x += w + 10; else if(s.x > w + 5) s.x -= w + 10;
          if(s.y < -5) s.y += h + 10; else if(s.y > h + 5) s.y -= h + 10;
        }
        const a = reduced ? s.baseAlpha : s.baseAlpha * (0.55 + 0.45 * Math.sin(t * s.speed + s.phase));
        ctx.beginPath();
        ctx.fillStyle = `rgba(233,242,255,${a})`;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      if(!reduced){
        const now = performance.now();
        if(now >= nextShootingStarAt){ spawnShootingStar(); nextShootingStarAt = scheduleNext(2500, 5500); }
        if(now >= nextMeteorAt){ spawnMeteor(); nextMeteorAt = scheduleNext(9000, 16000); }
        drawShootingStars();
        drawMeteors();
      }

      if(!reduced) requestAnimationFrame(paint);
    }

    window.addEventListener("resize", resize);
    resize();
    if(reduced){
      paint(0);
    } else {
      nextShootingStarAt = scheduleNext(600, 2000);
      nextMeteorAt = scheduleNext(4000, 9000);
      requestAnimationFrame(paint);
    }
  }

  initStarfield();
  render();
})();
</script>
</body>
</html>
